function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2800); }
function b64ToBuf(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function normTitle(s){ return String(s||"").split("\n")[0].toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9]/g,""); }
function xmlEsc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""); }
const SHEET_PATH="xl/worksheets/sheet1.xml";
function buildRow(r,vals){
  const cells=vals.map((v,i)=>{ const ref=COLS[i]+r, s=String(v??"");
    return s.trim()===""?`<x:c r="${ref}" s="14" />`:`<x:c r="${ref}" s="14" t="str"><x:v xml:space="preserve">${xmlEsc(s)}</x:v></x:c>`; }).join("");
  return `<x:row r="${r}" ht="62" customHeight="1">${cells}</x:row>`;
}
async function exportXlsx(){
  try{
    const zip=await JSZip.loadAsync(b64ToBuf(XLSX_B64));
    let xml=(await zip.file(SHEET_PATH).async("string")).replace(/^﻿/,"");
    const lastRow=Math.max(150,P.length+1), empty=Array(14).fill(""), rows=[];
    for(let r=2;r<=lastRow;r++){ const p=P[r-2]; rows.push(buildRow(r,p?exportVals(p.id):empty)); }
    const head=xml.slice(0,xml.indexOf("<x:sheetData>")+13), tail=xml.slice(xml.indexOf("</x:sheetData>"));
    const row1=(xml.match(/<x:row r="1"[\s\S]*?<\/x:row>/)||[""])[0];
    xml=head+row1+rows.join("")+tail;
    if(lastRow>150){
      xml=xml.replace(/(sqref="[A-N]2:[A-N])150"/g,`$1${lastRow}"`);
      const tf=zip.file("xl/tables/table1.xml"); if(tf) zip.file("xl/tables/table1.xml",(await tf.async("string")).replace('ref="A1:N150"',`ref="A1:N${lastRow}"`));
    }
    zip.file(SHEET_PATH,xml);
    let wbx=await zip.file("xl/workbook.xml").async("string");
    if(!/calcPr/.test(wbx)) wbx=wbx.replace("</x:workbook>",'<x:calcPr fullCalcOnLoad="1" /></x:workbook>');
    zip.file("xl/workbook.xml",wbx);
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const d=new Date(), ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const fname=`${SOURCE_NAME}_导出.xlsx`;
    if(SERVER){
      try{
        const r=await fetch("/api/export?overwrite=1&name="+encodeURIComponent(fname),{method:"POST",body:blob});
        if(r.status===423){ toast("导出的表格正在 Excel 里开着，请先关掉它，再点「导出 Excel」"); return; }
        if(!r.ok) throw new Error(r.status);
        const saved=(await r.text()).trim(); let extra=""; try{ extra=await exportKP(); }catch(e){}
        toast("已更新「导出」文件夹："+saved+extra); return;
      }catch(e){ toast("没存进文件夹，改为浏览器下载"); }
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    toast("已导出："+a.download+"（在浏览器的下载文件夹里）");
  }catch(err){ console.error(err); toast("导出失败："+err.message); }
}
function resolvePath(base,target){
  if(target.startsWith("/")) return target.slice(1);
  const parts=base.split("/"); parts.pop();
  target.split("/").forEach(s=>{ if(s==="..") parts.pop(); else if(s!==".") parts.push(s); });
  return parts.join("/");
}
function byLocal(el,name){ return Array.from(el.getElementsByTagNameNS("*",name)); }
async function readSheetRows(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const dp=new DOMParser(), X=async p=>{ const f=zip.file(p); return f?dp.parseFromString((await f.async("string")).replace(/^﻿/,""),"application/xml"):null; };
  const wb=await X("xl/workbook.xml"), rels=await X("xl/_rels/workbook.xml.rels");
  const sheets=byLocal(wb,"sheet"), sh=sheets.find(s=>s.getAttribute("name")==="文献扫描总表")||sheets[0];
  const rid=sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")||sh.getAttribute("r:id");
  const relList=byLocal(rels,"Relationship"), rel=relList.find(r=>r.getAttribute("Id")===rid);
  const path=resolvePath("xl/workbook.xml",rel.getAttribute("Target"));
  let sst=[]; const relSst=relList.find(r=>/sharedStrings$/.test(r.getAttribute("Type")));
  if(relSst){ const sx=await X(resolvePath("xl/workbook.xml",relSst.getAttribute("Target"))); if(sx) sst=byLocal(sx,"si").map(si=>byLocal(si,"t").map(t=>t.textContent).join("")); }
  const doc=await X(path), out=[];
  byLocal(doc,"row").forEach(row=>{
    const vals=Array(14).fill("");
    byLocal(row,"c").forEach(c=>{
      const i=COLS.indexOf((c.getAttribute("r")||"").replace(/\d+/g,"")); if(i<0) return;
      const t=c.getAttribute("t"), v=byLocal(c,"v")[0];
      vals[i]= t==="s"?(sst[+(v?.textContent||0)]||""): t==="inlineStr"?byLocal(c,"t").map(x=>x.textContent).join(""): (v?v.textContent:"");
    });
    out.push({r:+row.getAttribute("r"),vals});
  });
  return out;
}
async function importXlsx(file){
  try{
    const rows=await readSheetRows(file);
    const map=Object.fromEntries(P.map(p=>[normTitle(p.en),p.id]));
    let n=0, added=0;
    rows.forEach(({r,vals})=>{
      if(r===1||!String(vals[0]).trim()) return;
      let id=map[normTitle(vals[0])];
      if(!id){
        const [en,...rest]=String(vals[0]).split("\n"); const zh=rest.join(" ").replace(/^中文：/,"");
        const p={id:"c"+Date.now()+"_"+r,group:"导入的论文",en:en.trim(),zh:zh.trim(),venue:vals[1],doi:[],url:vals[12]};
        S.custom.push(p); id=p.id; added++; rebuild(); map[normTitle(en)]=id;
      }
      S.notes[id]=Object.fromEntries(vals.slice(0,13).map((v,i)=>[i,v])); touch(id);
      Object.keys(RENAME).forEach(i=>{ const m=RENAME[i][S.notes[id][i]]; if(m) S.notes[id][i]=m; });
      Object.keys(DETAIL).forEach(k=>{ const i=+k, val=String(vals[i]||""), opt=(CHOICES[i]||[]).find(o=>val.startsWith(o+"：")||val.startsWith(o+":"));
        if(opt){ S.notes[id][i]=opt; S.notes[id][i+"d"]=val.slice(opt.length+1).trim(); } });
      const imgs=String(vals[IMG_COL]||"").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.replace(/^图片[\/\\]/,"").match(/^(.*?)(?:（(.*)）)?$/); return {file:m[1].trim(),cap:(m[2]||"").trim()}; }).filter(x=>x.file);
      S.images=S.images||{}; if(imgs.length) S.images[id]=imgs;
      track(id); n++;
    });
    rebuild(); persist(); renderList(); setView(S.view); if(S.view==="lit") open(S.cur);
    toast(n?`已从表格恢复 ${n} 篇的笔记`+(added?`，其中 ${added} 篇是清单外的论文，放在「导入的论文」分类`:""):"表格里没有找到论文");
  }catch(err){ console.error(err); toast("导入失败："+err.message); }
}

const GH={cfg:null,ready:false,sha:null};
function apiBase(){ try{ return localStorage.getItem("litwb.api")||"https://api.github.com"; }catch(e){ return "https://api.github.com"; } }
function touch(id){ if(!id) return; S.ts=S.ts||{}; S.ts[id]=Date.now(); }
function b64enc(str){ const b=new TextEncoder().encode(str); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(b64){ const bin=atob(b64.replace(/\s/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function encPath(p){ return p.split("/").map(encodeURIComponent).join("/"); }
async function gh(path,opt={}){
  const c=GH.cfg;
  const r=await fetch(apiBase()+"/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+path,{method:opt.method||"GET",body:opt.body,cache:"no-store",
    headers:Object.assign({Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})});
  if(r.status===401||r.status===403){ const e=new Error("auth "+r.status); e.auth=true; throw e; }
  return r;
}
async function ghGet(file){
  const r=await gh("/contents/"+encPath(file));
  if(r.status===404) return null;
  if(!r.ok) throw new Error("get "+r.status);
  const j=await r.json();
  let text;
  if(j.content&&j.encoding==="base64") text=b64dec(j.content);
  else{ const rr=await gh("/contents/"+encPath(file),{headers:{Accept:"application/vnd.github.raw+json"}}); text=await rr.text(); }
  return {text,sha:j.sha};
}
async function ghPutRaw(file,b64,sha,msg){
  const body={message:msg||("update "+file),content:b64}; if(sha) body.sha=sha;
  const r=await gh("/contents/"+encPath(file),{method:"PUT",body:JSON.stringify(body),headers:{"Content-Type":"application/json"}});
  if(r.status===409||r.status===422){ const e=new Error("conflict"); e.conflict=true; throw e; }
  if(!r.ok) throw new Error("put "+r.status);
  return (await r.json()).content.sha;
}
const UI_FIELDS=["cur","closed","more","view","sel","kpScope","kpOff","sidew","kpw"];
const PAPER_FIELDS=["notes","kp","images","trash","firstAt","doneAt"];
function mergeState(loc,rem){
  loc=loc||{}; rem=rem||{};
  const out=JSON.parse(JSON.stringify(rem));
  UI_FIELDS.forEach(f=>{ if(f in loc) out[f]=loc[f]; });
  if((loc.metaT||0)>(rem.metaT||0)){ ["paperOrder","groupOrder","moved","metaT"].forEach(f=>{ out[f]=loc[f]; }); }
  const lt=loc.ts||{}, rt=rem.ts||{}; out.ts=Object.assign({},rt);
  const ids=new Set([...Object.keys(lt),...Object.keys(rt)]);
  PAPER_FIELDS.forEach(f=>{ out[f]=out[f]||{}; });
  ids.forEach(id=>{
    const useLoc=(lt[id]||0)>(rt[id]||0);
    out.ts[id]=Math.max(lt[id]||0,rt[id]||0);
    if(useLoc) PAPER_FIELDS.forEach(f=>{ const src=loc[f]||{}; if(id in src) out[f][id]=JSON.parse(JSON.stringify(src[id])); else delete out[f][id]; });
  });
  PAPER_FIELDS.forEach(f=>{ const src=loc[f]||{}; Object.keys(src).forEach(id=>{ if(!ids.has(id)&&!(id in out[f])) out[f][id]=src[id]; }); });
  out.deleted=Object.assign({},rem.deleted||{},loc.deleted||{});
  const cm={}; (rem.custom||[]).forEach(c=>cm[c.id]=c); (loc.custom||[]).forEach(c=>{ if(!cm[c.id]||(lt[c.id]||0)>=(rt[c.id]||0)) cm[c.id]=c; });
  out.custom=Object.values(cm).filter(c=>!out.deleted[c.id]);
  return out;
}
let syncing=false, again=false;
async function syncUp(){
  if(!GH.ready) return;
  if(syncing){ again=true; return; }
  syncing=true; clearTimeout(serverTimer);
  try{
    for(let n=0;n<4;n++){
      try{
        GH.sha=await ghPutRaw("state.json",b64enc(JSON.stringify(S)),GH.sha,"update notes "+new Date().toISOString());
        try{ localStorage.removeItem(STORE_KEY+".dirty"); }catch(e){}
        setSaved("已同步到 GitHub "+hhmm()); setConn("ok"); break;
      }catch(e){
        if(!e.conflict) throw e;
        const rem=await ghGet("state.json");
        if(rem){ S=mergeState(S,JSON.parse(rem.text)); GH.sha=rem.sha; } else GH.sha=null;
        localSave(); refreshUI();
      }
    }
  }catch(e){ setConn(e.auth?"auth":"off"); setSaved("⚠ 暂未同步：已存在本机，联网后自动同步"); }
  finally{ syncing=false; if(again){ again=false; syncUp(); } }
}
function isDirty(){ try{ return !!localStorage.getItem(STORE_KEY+".dirty"); }catch(e){ return false; } }
async function pullNow(force){
  if(!GH.ready||syncing) return;
  if(!force&&isDirty()) return;
  try{
    const rem=await ghGet("state.json");
    if(rem&&rem.sha!==GH.sha){ S=mergeState(S,JSON.parse(rem.text)); GH.sha=rem.sha; localSave(); refreshUI(); }
    setConn("ok");
  }catch(e){ setConn(e.auth?"auth":"off"); }
}

  }catch(e){
    if(e.auth){ try{ localStorage.removeItem("litwb.gh"); }catch(x){} GH.cfg=null; startLocal(); showSetup("钥匙无效或已过期：已切回本机模式。可以重新输入钥匙，或点「先不开」"); return; }

/* ---------- mobile table of contents (drawer) ---------- */
const TOC_MQ=window.matchMedia("(max-width:900px)");
function isNarrow(){ return TOC_MQ.matches; }
function setToc(on){
  document.body.classList.toggle("toc-open",!!on);
  document.getElementById("tocBtn").setAttribute("aria-expanded",on?"true":"false");
  if(!on){ hideCtx(); return; }
  const side=document.querySelector(".side"), a=side.querySelector(".item.active");
  if(a){ const top=a.offsetTop, bot=top+a.offsetHeight; if(top<side.scrollTop+60||bot>side.scrollTop+side.clientHeight) side.scrollTop=Math.max(0,top-side.clientHeight/2); }
}
document.getElementById("tocBtn").onclick=()=>setToc(true);
document.getElementById("tocClose").onclick=()=>setToc(false);
document.getElementById("tocMask").onclick=()=>setToc(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.body.classList.contains("toc-open")) setToc(false); });
(function(){ const f=()=>{ if(!isNarrow()) setToc(false); }; if(TOC_MQ.addEventListener) TOC_MQ.addEventListener("change",f); else if(TOC_MQ.addListener) TOC_MQ.addListener(f); })();
document.querySelector(".side").addEventListener("scroll",hideCtx,{passive:true});
boot();
</script>
</body>
</html>
