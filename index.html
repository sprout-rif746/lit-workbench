<script>
let DATA = {"headers": ["论文题目", "年份 / 阵地", "主研究类型", "研究场景 / 技术介入", "核心研究问题", "研究设计 / 方法", "主要证据方式", "主要发现", "未解决问题", "主要Gap", "对我研究的启发", "阅读等级", "DOI / 链接"], "groups": ["A 遗产 × 大模型 / 知识图谱交互", "B 遗产 × VR / AR × AI", "C 人怎么看待和使用 AI 证据"], "papers": [{"id": "r1", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Graph Retrieval-Augmented Generation: A Survey", "zh": "图检索增强生成综述", "venue": "ACM TOIS，2025（综述）", "doi": ["10.1145/3777378"], "url": "https://doi.org/10.1145/3777378", "abstract": "近来，检索增强生成（Retrieval-Augmented Generation，RAG）在无需重新训练的前提下应对大语言模型（LLM）面临的挑战方面取得了显著成功。通过引用外部知识库，RAG 能够优化 LLM 的输出，有效缓解“幻觉”、缺乏特定领域知识以及信息过时等问题。然而，数据库中不同实体之间关系结构复杂，给 RAG 系统带来了挑战。为此，GraphRAG 利用实体间的结构信息，实现更精确、更全面的检索，捕获关系型知识，并促成更准确、更具上下文感知能力的回答。鉴于 GraphRAG 的新颖性与潜力，对现有技术进行系统性综述十分必要。本文首次对 GraphRAG 方法进行了全面梳理。我们将 GraphRAG 的工作流程形式化，涵盖基于图的索引（Graph-Based Indexing）、图引导的检索（Graph-Guided Retrieval）和图增强的生成（Graph-Enhanced Generation）三个环节，随后概述各阶段的核心技术与训练方法。此外，我们还考察了 GraphRAG 的下游任务、应用领域、评估方法及工业应用案例。最后，我们探讨了未来的研究方向，以期启发进一步探索并推动该领域的进展。为跟踪最新进展，我们建立了一个代码库：https://github.com/pengboci/GraphRAG-Survey。", "abstract_en": "Recently, Retrieval-Augmented Generation (RAG) has achieved remarkable success in addressing the challenges of Large Language Models (LLMs) without necessitating retraining. By referencing an external knowledge base, RAG refines LLM outputs, effectively mitigating issues such as “hallucination,” lack of domain-specific knowledge, and outdated information. However, the complex structure of relationships among different entities in databases presents challenges for RAG systems. In response, GraphRAG leverages structural information across entities to enable more precise and comprehensive retrieval, capturing relational knowledge and facilitating more accurate, context-aware responses. Given the novelty and potential of GraphRAG, a systematic review of current technologies is imperative. This article provides the first comprehensive overview of GraphRAG methodologies. We formalize the GraphRAG workflow, encompassing Graph-Based Indexing, Graph-Guided Retrieval, and Graph-Enhanced Generation. We then outline the core technologies and training methods at each stage. Additionally, we examine downstream tasks, application domains, evaluation methodologies, and industrial use cases of GraphRAG. Finally, we explore future research directions to inspire further inquiries and advance progress in the field. In order to track recent progress, we set up a repository at https://github.com/pengboci/GraphRAG-Survey.", "stars": 2, "rev": true, "rank": "JCR Q1 · IF 11.2 · CCF-A 期刊"}, {"id": "r2", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Knowledge Graph Applications in Cultural Heritage: A ROSES-Based Systematic Review", "zh": "文化遗产中的知识图谱应用：基于 ROSES 的系统综述", "venue": "Information（MDPI），2026（系统综述，248 项研究）", "doi": ["10.3390/info17030269"], "url": "https://doi.org/10.3390/info17030269", "abstract": "知识图谱（Knowledge Graphs，KGs）在文化遗产研究中的应用日益广泛，用以应对语义异质性、数据碎片化和跨机构知识整合等挑战。尽管基于知识图谱的遗产系统发展迅速，但对现有应用进行全面且方法严谨的综合仍然有限。为弥补这一不足，本研究依据系统证据综合报告标准（Reporting Standards for Systematic Evidence Syntheses，ROSES），对文化遗产领域的知识图谱应用开展系统综述，旨在考察主要应用领域、方法模式和新兴研究趋势。研究在 Scopus、Web of Science 和 IEEE Xplore 中进行了结构化检索；经去重、筛选、资格评估和质量评价后，最终保留 2015 至 2024 年间发表的 248 篇同行评议研究用于综合分析。研究采用描述性分析与主题综合相结合的混合方法，分析知识图谱的构建策略、技术组成、应用情境和所报告的成果。结果表明，知识图谱主要应用于五个相互关联的领域：数字化记录与保存、知识管理与整合、保护与修复支持、文化传播与教育，以及研究与创新。在方法上，文献显示出一种转变：由本体驱动、人工整理的知识模型，转向融合自然语言处理和机器学习等人工智能技术的混合方法。然而，本体对齐、可扩展性、评估不一致以及跨项目互操作性有限等问题依然存在。本综述为文化遗产领域的知识图谱应用提供了系统整合且透明的证据基础，并推进了对知识图谱的概念性理解，即将其视为中介文化知识表征与阐释的社会技术基础设施。研究结果为研究者、遗产从业者和系统设计者提供了方法论启示和实践意义，同时指明了未来跨学科研究的方向。", "abstract_en": "Knowledge Graphs (KGs) are increasingly adopted in cultural heritage research to address challenges of semantic heterogeneity, data fragmentation, and cross-institutional knowledge integration. Despite the rapid growth of KG-based heritage systems, a comprehensive and methodologically rigorous synthesis of existing applications remains limited. To address this gap, this study conducts a ROSES-based systematic review of KG applications in cultural heritage, aiming to examine prevailing application domains, methodological patterns, and emerging research trends. Following the Reporting Standards for Systematic Evidence Syntheses (ROSES), a structured search was conducted in Scopus, Web of Science, and IEEE Xplore. After duplicate removal, screening, eligibility assessment, and quality appraisal, 248 peer-reviewed studies published between 2015 and 2024 were retained for final synthesis. A mixed-method approach combining descriptive analysis and thematic synthesis was employed to analyze KG construction strategies, technological components, application contexts, and reported outcomes. The results indicate that KGs are primarily applied in five interconnected areas: digital recording and preservation, knowledge management and integration, protection and restoration support, cultural transmission and education, and research and innovation. Methodologically, the literature reveals a transition from ontology-driven and manually curated knowledge models toward hybrid approaches integrating artificial intelligence techniques such as natural language processing and machine learning. However, persistent challenges remain, including ontology alignment, scalability, evaluation inconsistency, and limited cross-project interoperability. This review contributes a consolidated and transparent evidence base for KG applications in cultural heritage and advances a conceptual understanding of KGs as socio-technical infrastructures that mediate cultural knowledge representation and interpretation. The findings offer methodological insights and practical implications for researchers, heritage professionals, and system designers, while highlighting directions for future interdisciplinary research.", "stars": 3, "rev": true, "rank": "JCR Q2 · IF 4.3 · ESCI 收录"}, {"id": "n11", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Whose Innovation? Whose Heritage?: Postcolonial Tensions and Meta-Research Agendas about Chinese Intangible Cultural Heritage Research in HCI", "zh": "谁的创新？谁的遗产？：HCI中关于中国非物质文化遗产研究的后殖民张力与元研究议程", "venue": "DIS 2026 Companion（元研究 / 综述性）", "doi": ["10.1145/3802974.3809451"], "url": "https://doi.org/10.1145/3802974.3809451", "abstract": "在数字化和技术创新议程的推动下，非物质文化遗产（ICH）日益成为人机交互（HCI）领域关注的焦点。本文基于学习竹编的田野经验以及对中国数字ICH研究的批判性回顾，考察“创新”如何成为指导研究实践及与工匠合作的主导框架。现有工作往往将具身的工艺知识转译为技术表征，而忽视了情境性创造力、基于学徒制的学习以及地方性认识论。本文借助后殖民计算的视角指出，创新话语有可能把工匠定位为技术中心主义进步的贡献者，同时遮蔽遗产实践内部的社会技术张力。本文并非拒斥创新，而是提出一项元层面的研究议程，强调研究者的立场性、社区参与，以及对技术介入与工艺实践之间关系的批判性反思。", "abstract_en": "Intangible Cultural Heritage (ICH) has become an increasing focus in Human–Computer Interaction (HCI), shaped by agendas of digitization and technological innovation. Drawing on field experience learning bamboo weaving and a critical review of Chinese digital ICH research, this paper examines how “innovation” has become the dominant frame guiding research practices and collaborations with craftsmen. Existing work often translates embodied craft knowledge into technological representations, overlooking situated creativity, apprenticeship-based learning, and local epistemologies. Through a postcolonial computing lens, the paper argues that innovation discourse risks positioning craftsmen as contributors to technocentric progress while obscuring socio-technical tensions within heritage practices. Rather than rejecting innovation, the provocation proposes a meta-level research agenda emphasizing positionality, community participation, and critical reflection on the relationship between technological intervention and craft practice.", "stars": 2, "rev": true, "rank": "未入分区（DIS Companion，非全文）"}, {"id": "n1", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Gen-Diaolou: An Integrated AI-Assisted Interactive System for Diachronic Understanding and Preservation of the Kaiping Diaolou", "zh": "Gen-Diaolou：一个用于开平碉楼历时性理解与保护的集成式AI辅助交互系统", "venue": "CHI 2026 全文", "doi": ["10.1145/3772318.3790720"], "url": "https://doi.org/10.1145/3772318.3790720", "abstract": "联合国教科文组织世界遗产地开平碉楼与村落是受移民文化影响而形成的中西合璧建筑的典型代表。然而，建筑遗产的参与常面临真实性争议、资源限制以及参与式方法不足等问题。本研究探讨了将人工智能（AI）应用于建筑遗产的现有挑战，以及AI辅助交互系统如何增进人们对文化遗产的理解和保护意识。我们首先开展了一项形成性研究（N=14），从遗产相关利益方处获取实证洞见以指导设计。基于这些洞见，我们设计了Gen-Diaolou，这是一个支持遗产理解与保护的集成式AI辅助交互系统。一项预研究（N=18）和一项博物馆现场研究（N=26）提供了相互印证的证据，表明Gen-Diaolou可能有助于提升参观者对碉楼的历时性理解和保护意识，并为未来面向数字文化遗产参与的人机协作系统提出了设计启示。更广泛而言，本研究弥合了人机交互（HCI）领域中被动式遗产系统与不受约束的创意工具之间的研究空白。", "abstract_en": "The Kaiping Diaolou and Villages, a UNESCO World Heritage Site, exemplify hybrid Chinese and Western architecture shaped by migration culture. However, architectural heritage engagement often faces authenticity debates, resource constraints, and limited participatory approaches. This research explores current challenges of leveraging Artificial Intelligence (AI) for architectural heritage, and how AI-assisted interactive systems can foster cultural heritage understanding and preservation awareness. We conducted a formative study (N=14) to uncover empirical insights from heritage stakeholders that inform design. These insights informed the design of Gen-Diaolou, an integrated AI-assisted interactive system that supports heritage understanding and preservation. A pilot study (N=18) and a museum field study (N=26) provided converging evidence suggesting that Gen-Diaolou may support visitors’ diachronic understanding and preservation awareness, and together informed design implications for future human–AI collaborative systems for digital cultural heritage engagement. More broadly, this work bridges the research gap between passive heritage systems and unconstrained creative tools in the HCI domain.", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n2", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "What Does AI Do for Cultural Interpretation? A Randomized Experiment on Close Reading Poems with Exposure to AI Interpretation", "zh": "AI对文化阐释有何作用？一项让被试接触AI阐释的诗歌细读随机实验", "venue": "CHI 2026 全文（预注册 RCT）", "doi": ["10.1145/3772318.3791727"], "url": "https://doi.org/10.1145/3772318.3791727", "abstract": "AI展现出前所未有的推理能力，但其通过自动化阅读与摘要日益融入人类推理，引发了关于其能否用于文化阐释的争论。细读（close reading），即出于审美愉悦而理解、分析和评论文化文本的实践，是此类阐释的核心技能，传统上被视为人类所独有。为检验AI对细读的影响（包括阐释表现与愉悦感两方面），我们开展了一项预注册随机实验（n = 400），考察在诗歌细读中呈现单一或多种AI阐释的AI辅助，与无AI辅助相比所产生的影响。我们发现，单一AI阐释同时提升了表现与愉悦感，而多种AI阐释仅提升了表现。进一步探索揭示了一种权衡：高度依赖AI的参与者任务表现更好，但愉悦感更低。我们的结果为“是否以及如何校准文化阐释中的AI辅助”这一讨论提供了参考：“少即是多”。", "abstract_en": "AI demonstrates unprecedented reasoning capabilities, but its increasing integration into human reasoning via automated reading and summarization has provoked debate about its use for cultural interpretation. Close reading—the practice of understanding, analyzing, and critiquing cultural texts for pleasure—is a skill at the core of such interpretation, traditionally being seen as exclusive to humans. To test AI’s impact on close reading, both in terms of interpretative performance and pleasure, we conducted a preregistered randomized experiment (n = 400) investigating the impact of AI assistance by presenting single or multiple AI interpretations, on close reading poems, compared to no AI assistance. We found that single AI interpretation boosted both performance and pleasure, while multiple AI interpretations only improved performance. Further exploration revealed a trade-off: participants who heavily relied on AI showed better performance on the task but lower pleasure. Our results contribute to discussion on whether and how to calibrate AI assistance for cultural interpretation: “less is more.”", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n4", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "ACPAS: an expert-assistance system for authenticating ancient Chinese paintings via LLM-based agents", "zh": "ACPAS：一种基于LLM智能体的中国古代书画鉴定专家辅助系统", "venue": "npj Heritage Science，2025", "doi": ["10.1038/s40494-025-02093-z"], "url": "https://www.nature.com/articles/s40494-025-02093-z", "abstract": "中国古代绘画的鉴定对于保护和传承文化遗产至关重要。然而，传统鉴定方法高度依赖专家的知识与经验，难以处理非结构化的多模态信息。此外，交互工具的缺乏也阻碍了人文学者有效应用先进技术。本研究提出ACPAS，一种实现专家主导、AI辅助鉴定模式的智能鉴定系统。该系统利用大语言模型（LLM）理解专家需求，并将其分配给相应的工具模块处理；系统集成了图像处理、文本检索和结构化数据库，并采用交互式可视化支持推理。案例研究和用户评估表明，ACPAS提高了效率并增强了结果的可解释性。该系统为文化遗产保护与数字人文研究提供了新范式，促进了人工智能与人文学科的深度融合。", "abstract_en": "Authentication of ancient Chinese paintings is crucial to protecting and preserving cultural heritage. However, traditional authentication methods rely heavily on expert knowledge and experience, and are difficult to handle unstructured and multimodal information. In addition, the lack of interactive tools also hinders humanities scholars from effectively applying advanced technologies. In this study, we present ACPAS, an intelligent authentication system that enables an expert-led, AI-assisted authentication model. The system uses Large Language models (LLMs) to interpret the needs of experts and assigns them to the corresponding tool modules for processing. It integrates image processing, text retrieval, and structured databases, and employs interactive visualizations to support reasoning. Case studies and user evaluations demonstrate that ACPAS improves efficiency and results in interpretability. It provides a new paradigm for cultural heritage protection and digital humanities research and promotes the deep integration of artificial intelligence and humanities.", "stars": 2, "rev": false, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n12", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "An LLM-based QA system for Chinese Painting and Calligraphy with Knowledge Graphs and external documents", "zh": "一种融合知识图谱与外部文档的基于LLM的中国书画问答系统", "venue": "npj Heritage Science，2025", "doi": ["10.1038/s40494-025-02219-3"], "url": "https://www.nature.com/articles/s40494-025-02219-3", "abstract": "中国书画（ChP&C）是中国文化遗产的关键组成部分，具有丰富的历史与艺术价值。尽管大语言模型（LLM）在开放域问答（QA）方面表现出色，但在特定领域情境中常出现幻觉。为此，我们提出一种中国书画问答方法，将LLM与利用知识图谱（KG）和外部文档的检索增强方法相结合。该方法将复杂问题分解为子问题和实体，从KG和文档中检索相关知识，并通过专门模块整合答案。我们构建了一个聚焦中国书画的问答数据集以验证所提方法。此外，我们还开发了一个问答系统，用以系统评估其在实际应用中的性能。实验结果表明，通过有效结合结构化与非结构化信息，语义理解和答案准确性均得到提升。该系统为获取中国书画知识提供了可靠工具，并可为其他文化遗产领域的智能问答提供参考。", "abstract_en": "Chinese Painting and Calligraphy (ChP&C), key elements of Chinese cultural heritage, hold rich historical and artistic value. Although Large Language Models (LLMs) excel in open-domain question answering (QA), they often suffer from hallucinations in domain-specific contexts. To address this, we propose a ChP&C QA method integrating LLMs with a retrieval-augmented approach using a Knowledge Graph (KG) and external documents. The method decomposes complex questions into sub-questions and entities, retrieves relevant knowledge from KG and documents, and integrates answers via a dedicated module. We constructed a QA dataset focused on ChP&C to validate the proposed method. Additionally, a QA system was developed to systematically evaluate its performance in real-world applications. Experimental results demonstrate improved semantic understanding and answer accuracy by effectively combining structured and unstructured information. This system offers a reliable tool for accessing ChP&C knowledge and serves as a reference for intelligent QA in other cultural heritage domains.", "stars": 2, "rev": false, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n5", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "YuOpera-Omni for multimodal retrieval and constraint aware generation in Henan Opera", "zh": "YuOpera-Omni：面向河南豫剧的多模态检索与约束感知生成", "venue": "npj Heritage Science，2026", "doi": ["10.1038/s40494-026-02731-0"], "url": "https://www.nature.com/articles/s40494-026-02731-0", "abstract": "河南豫剧是一种高度程式化的非物质文化遗产，其表演知识分散于身段、唱腔、节奏组织与唱词形式之中。现有的通用多模态模型和语言模型缺乏领域基础，往往无法满足戏曲特有的结构约束，限制了其在档案分析、教学和内容创作中的价值。我们提出YuOpera-Omni，一个面向遗产的多模态框架，在统一流程中将细粒度感知、结构化属性检索与约束感知生成相连接。该系统从视频、音频和文本中提取可解释的戏曲属性，利用这些属性从多模态知识库中检索技术上相容的参考资料，并在明确的形式约束下生成有证据支撑的评析以及符合韵律的唱词草稿。我们还构建了一个面向领域的基准数据集，包含对齐的录音、唱词、元数据和专家标注。实验表明，YuOpera-Omni提升了检索相关性，减少了幻觉，并取得了较高的押韵准确率，为基于数字化的豫剧理解与保护提供了支持。", "abstract_en": "Henan Yu Opera is a highly stylized form of intangible cultural heritage whose performance knowledge is distributed across gesture, vocal delivery, rhythmic organization, and lyric form. Existing general multimodal and language models lack domain grounding and often fail to satisfy opera-specific structural constraints, limiting their value for archive analysis, pedagogy, and content creation. We propose YuOpera-Omni, a heritage-oriented multimodal framework that links fine-grained perception, structured-attribute retrieval, and constraint-aware generation within a unified pipeline. The system extracts interpretable opera attributes from video, audio, and text, leverages them to retrieve technically compatible references from a multimodal knowledge base, and generates evidence-grounded critiques and rhyme-compliant lyric drafts under explicit formal constraints. We also construct a domain-oriented benchmark with aligned recordings, lyrics, metadata, and expert annotations. Experiments show that YuOpera-Omni improves retrieval relevance, reduces hallucination, and achieves high rhyme accuracy, supporting digitally grounded Yu Opera understanding and preservation.", "stars": 1, "rev": false, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n10", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Knowledge Graphs vs. Large Language Models: Competitors or Partners in Supporting Virtual Museums", "zh": "知识图谱与大语言模型：支持虚拟博物馆的竞争者还是合作者？", "venue": "ACM JOCCH，2025", "doi": ["10.1145/3756016"], "url": "https://doi.org/10.1145/3756016", "abstract": "虚拟博物馆是传播和记录文化遗产（CH）内容的切实手段，也是适合开展文物语义标注和自动虚拟导览的环境。为此，我们识别并比较了数字文化遗产语义信息策略中的传统（基于本体）方法、大语言模型（LLM）扩展方法和纯LLM方法。传统方法通过一个应用原型加以描述，而涉及LLM的方法则通过实验进行检验。为考察与LLM相关的核心任务，我们的实验包括：（i）针对一件绘画样本，使用CIDOC概念参考模型（CRM）进行语义标注并借助LLM生成知识图谱（KG）；（ii）仅依靠LLM、以目录描述为输入对绘画进行排序。实验展示了这些方法在增强艺术品阐释、描述以及结果完善方面的潜力。基于关于传统语义标注的相关文献和所开展的LLM实验，本体与LLM相结合可能是最优方案，因为它既具备结构化知识的准确性，又提供了能将这些要素与自然语言相互转换的工具。仅依赖LLM可能有风险，因为LLM训练数据中缺乏特定领域知识，而传统方法则需要特定领域的专业知识且更为耗时。我们的方法在多种场景中显示出潜力，例如引导博物馆观众找到符合其兴趣的文物、协助博物馆策展人进行文献记录，或帮助文化遗产研究者识别藏品间的相似性。", "abstract_en": "Virtual museums are factual means for the dissemination and documentation of Cultural Heritage (CH) content. They are suitable environments for the semantic annotation of artifacts and automatic virtual guides. To this end, we identify and compare Traditional (ontology-based), Large Language Model (LLM)-extended, and LLM-pure methods for the semantic information strategies of digital CH. The traditional method is described through an application prototype, while the methods that involve LLM are tested experimentally. To investigate the integral tasks related to LLMs, our experiments include (i) semantic annotation using the CIDOC Conceptual Reference Model (CRM) and Knowledge Graph (KG) generation with LLMs for a painting sample, and (ii) painting ranking relying solely on LLMs using catalog descriptions as input. The experiments demonstrate the potential of these methods to enhance artwork interpretation, description, and refinement of the results. Based on the relevant literature on traditional semantic annotation and conducted experiments with LLMs, a combination of ontologies and LLMs may provide an optimal approach, as it offers the accuracy of structured knowledge while providing a tool that interprets these elements into natural language and vice versa. Relying solely on LLMs may be risky due to the lack of domain-specific knowledge in the training data of LLMs, whereas traditional methods demand expertise in a specific domain and are more time-consuming. Our approach shows potential in use cases such as guiding museum visitors to artifacts that match their interests, assisting museum curators with documentation, or helping CH researchers identify similarities in artifact collections.", "stars": 3, "rev": false, "rank": "JCR Q3 · IF 3.1"}, {"id": "n3", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "Implicit Affective Steering: A Design Probe for Generative Curatorial Storytelling", "zh": "隐式情感引导：面向生成式策展叙事的设计探针", "venue": "DIS 2026 全文", "doi": ["10.1145/3800645.3812861"], "url": "https://doi.org/10.1145/3800645.3812861", "abstract": "生成式AI为数字文化遗产提供了可扩展的参与方式，但现有工作流依赖复杂的提示词，为非专业受众造成了交互瓶颈。为弥补这一不足，我们提出MoodCurator，这是一个基于网页的设计探针，可为策展叙事提供低门槛的隐式情感引导。该系统以三通道循环取代提示工程：受众（1）选择色板以暗示叙事基调；（2）遴选艺术作品以使叙事扎根于视觉内容；（3）选择阐释声音以约束修辞立场。一项混合方法研究（N = 64）显示，系统在感知可用性和用户能动性方面呈现出令人鼓舞的模式。后续的出声思维研究（N = 10）发现，在该英文部署环境中反复出现阐释不匹配的情形。本研究的贡献包括：（1）为AI支持的文化阐释提出一种可理解的引导范式；（2）提供关于可用性、能动性与叙事共鸣的探索性实证证据；（3）为未来系统提供更明确、可质疑的框架控制方面的初步设计启示。", "abstract_en": "Generative AI offers scalable engagement with digital cultural heritage, yet current workflows rely on complex prompts, creating an interaction bottleneck for non-expert audiences. To address this gap, we introduce MoodCurator, a web-based design probe enabling low-friction, implicit affective steering for curatorial storytelling. The system replaces prompt engineering with a three-channel loop: audiences (1) select a colour palette to suggest narrative tone; (2) curate artworks to ground the narrative in visual content; and (3) choose an interpretive voice to constrain rhetorical stance. A mixed-methods study (N = 64) demonstrated encouraging patterns of perceived usability and user agency. A follow-up think-aloud study (N = 10) surfaced recurring cases of interpretive mismatch in this English-language deployment. Contributions include: (1) a legible steering paradigm for AI-supported cultural interpretation; (2) exploratory empirical evidence on usability, agency, and narrative resonance; and (3) preliminary design implications for more explicit and contestable framing controls in future systems.", "stars": 1, "rev": false, "rank": "CCF-C 会议"}, {"id": "n6", "group": "A 遗产 × 大模型 / 知识图谱交互", "en": "To Bot or Not? Conversational Agents and Authentic Heritage Experiences", "zh": "是否使用聊天机器人？对话式智能体与真实的遗产体验", "venue": "CHI 2026 Extended Abstracts", "doi": ["10.1145/3772363.3798924"], "url": "https://doi.org/10.1145/3772363.3798924", "abstract": "生成式AI正在迅速重塑遗产阐释，许多博物馆以提升观众参与度为名采用AI。行业话语在倡导负责任地采用AI的同时，往往对AI在交互性、个性化和沉浸感方面的前景大加称颂。本文通过一项英国调查的结果打破了这种乐观态度，该调查考察了受众对对话式智能体（生成式AI在博物馆中一种前景看好的应用）的看法。尽管这些智能体能够促进参与，我们的结果却揭示了一幅复杂的现实：48%的参与者对其在博物馆中的使用表示担忧。我们的分析识别出三种核心风险，它们挑战了关于AI在增进遗产参与中作用的既有假设：可能分散对遗产藏品的注意力、侵蚀人文式的参与方式，以及使观众体验去个性化。本文引发了关于如何设计AI系统以维持而非损害真实博物馆体验的批判性对话，并由此为该行业示范负责任地采用和使用AI的使命作出贡献。", "abstract_en": "Generative AI is rapidly reshaping heritage interpretation, with many museums adopting AI in the name of enhanced visitor engagement. Sector discourse, while championing responsible AI adoption, often celebrates AI’s promises of interactivity, personalisation, and immersion. This paper disrupts that optimism through findings from a UK-based survey examining audience perceptions of conversational agents, a promising generative AI application in museums. While these agents can support engagement, our results reveal a complicated reality: 48% of participants voiced concerns about their use in museums. Our analysis identifies three core risks that challenge assumptions about AI’s role in enhancing heritage engagement: its potential to distract from heritage collections, erode humanistic forms of engagement, and de-personalise visitor experiences. This paper provokes critical dialogue on how AI systems can be designed to sustain, rather than compromise authentic museum experiences, and in doing so, contributes to the sector’s mission in modeling responsible AI adoption and use.", "stars": 1, "rev": false, "rank": "未入分区（CHI 扩展摘要，非全文）"}, {"id": "r3", "group": "B 遗产 × VR / AR × AI", "en": "A systematic review of digital transformation technologies in museum exhibition", "zh": "博物馆展览中数字化转型技术的系统综述", "venue": "Computers in Human Behavior，2024（系统综述）", "doi": ["10.1016/j.chb.2024.108407"], "url": "https://doi.org/10.1016/j.chb.2024.108407", "abstract": "无论是临时展览还是常设展览，博物馆展览都是连接社会与其文化、历史和艺术遗产地的重要纽带。通过在博物馆展览中策划文物和主题陈列，可以促进对话、培育文化欣赏，并有助于遗产保护。传统的博物馆办展方式高度依赖设计师和策展人员的专业知识，从构思到观众参与度分析，整个过程都属于劳动密集型。本综述系统地汇集并考察了数字化转型技术（digital transformation technologies，DTTs）的应用如何革新博物馆展览并拓展其未来潜力。人工智能、沉浸式技术、增材制造、物联网和云计算等 DTTs 有助于打造引人入胜的设计，提升可达性和包容性，增强教育潜力，并支持精细的观众体验数据收集与分析，从而改进展品管理。然而，尽管已有多项关于 DTTs 及其在博物馆展览中作用的专门研究，技术与应用场景之间的联系仍未得到充分探讨。通过弥补这一空白，本研究有望为博物馆和遗产领域的从业者提供参考与启发，并为学者提出新的研究方向。", "abstract_en": "Museum exhibitions, both temporary and permanent, form an essential link between a society and its cultural, historical, and artistic heritage sites. Curating artifacts and thematic displays in museum exhibitions can promote dialogue, foster cultural appreciation, and contribute to heritage preservation. The traditional way of holding museum exhibitions, heavily reliant on the expertise of designers and curatorial staff, makes them a labor-intensive process, from conceptualization to visitor engagement analysis. This review systematically compiles and examines how the application of digital transformation technologies (DTTs) has revolutionized museum exhibitions and augmented their future potential. DTTs such as artificial intelligence, immersive technologies, additive manufacturing, the Internet of Things, and cloud computing can help create engaging designs, improve accessibility and inclusivity, enhance educational potential, and allow for sophisticated visitor experience data collection and analyses, improving exhibit management. However, despite multiple specialized studies on DTTs and their roles in museum exhibitions, the connections between technology and application scenarios remain underexplored. By addressing this gap, this study is expected to inform and inspire practitioners in the museum and heritage sectors and present new research avenues for scholars.", "stars": 3, "rev": true, "rank": "JCR Q1 · IF 12.2 · SSCI"}, {"id": "r5", "group": "B 遗产 × VR / AR × AI", "en": "Virtual Reality for Cultural Heritage: A Systematic Review and the Proposal of the AMUX-VR Framework", "zh": "文化遗产中的虚拟现实：系统综述及 AMUX-VR 框架的提出", "venue": "IJHCI，2025（系统综述，44 项研究）", "doi": ["10.1080/10447318.2025.2562962"], "url": "https://doi.org/10.1080/10447318.2025.2562962", "abstract": "虚拟现实（VR）已成为文化遗产领域的一种重要媒介，使人们能够沉浸式地接触历史环境与叙事。然而，许多遗产类 VR 应用仍缺乏适应性、个性化和多模态交互，限制了其对多样化受众的成效。本文对 2018 至 2025 年间发表的 44 项研究进行了系统综述，这些研究考察了遗产 VR 中的用户体验（UX）挑战，重点关注导航、交互和沉浸感。主题综合揭示了塑造用户参与的五个关键设计维度：自适应导航、多模态感官反馈、个性化内容、动态叙事和直观交互。在此基础上，我们提出 AMUX-VR 框架，即一种自适应多模态用户体验（Adaptive Multimodal User Experience）模型，旨在使遗产 VR 环境与用户需求和行为相匹配。该框架提供了一种灵活的、以用户为中心的设计策略，可在文化旅游、教育和保护情境中增强临场感、可用性和教育影响。", "abstract_en": "Virtual Reality (VR) has emerged as a valuable medium for cultural heritage, enabling immersive engagement with historical environments and narratives. Yet many heritage VR applications still lack adaptivity, personalization, and multimodal interaction, limiting their effectiveness for diverse audiences. This paper presents a systematic review of 44 studies published between 2018 and 2025 that examine user experience (UX) challenges in heritage VR, with a focus on navigation, interaction, and immersion. A thematic synthesis highlights five critical design dimensions that shape user engagement: adaptive navigation, multimodal sensory feedback, personalized content, dynamic storytelling, and intuitive interaction. Building on these insights, we introduce the AMUX-VR framework, an Adaptive Multimodal User Experience model designed to align heritage VR environments with user needs and behaviors. The framework provides a flexible, user-centered design strategy that enhances presence, usability, and educational impact across cultural tourism, education, and preservation contexts.", "stars": 2, "rev": true, "rank": "JCR Q1 · IF 6.1 · CCF-B 期刊"}, {"id": "r4", "group": "B 遗产 × VR / AR × AI", "en": "A scoping review on haptic-mediated immersive museum experiences (HM-IMEs): trends, mechanisms and opportunities", "zh": "触觉介导的沉浸式博物馆体验（HM-IMEs）的范围综述：趋势、机制与机遇", "venue": "npj Heritage Science，2026（范围综述，72 项研究）", "doi": ["10.1038/s40494-026-02641-1"], "url": "https://www.nature.com/articles/s40494-026-02641-1", "abstract": "触觉介导的沉浸式博物馆体验（haptic-mediated immersive museum experiences，HM-IMEs）正在迅速扩展，但相关证据仍较为零散，难以转化为面向博物馆的设计与评估指南。我们按照 PRISMA-ScR 开展了范围综述，纳入 72 项涵盖实验室、混合及博物馆现场情境的实证研究，并采用“系统—机制—结果”（System–Mechanism–Outcome）描述符、系统配置编码和评估指标对其进行编目。文献中机制丰富，但稳定程度不均：感官一致性以及叙事/阈限编排被频繁报告并得到操作化，而动作关联引导和可及性中介则较少得到一致的界定。进展还受到两方面的制约：一是对驱动与映射逻辑的报告不足，二是评估生态以自我报告为主，混合式的现场证据有限。因此，我们将触觉重新界定为面向博物馆的中介层，并提出三项可迁移的成果：一个整合的“系统—机制—结果”分类体系、一幅评估生态图谱，以及一套最低限度报告集，以支持可部署的 HM-IME 设计、跨情境更一致的验证，以及跨研究的累积可比性。", "abstract_en": "Haptic-mediated immersive museum experiences (HM-IMEs) are expanding rapidly, yet the evidence remains fragmented and difficult to translate into museum-facing design and evaluation guidance. We conducted a PRISMA-ScR scoping review of 72 empirical studies across laboratory, mixed, and in-museum contexts, charted using System–Mechanism–Outcome descriptors, system-configuration codes, and evaluation measures. The literature is mechanism-rich but unevenly stabilised: sensory congruence and narrative/threshold orchestration are frequently reported and operationalised, whereas motor-contingent guidance and accessibility mediation are less consistently specified. Progress is further constrained by under-reporting of actuation and mapping logic and by an evaluation ecology dominated by self-report, with limited mixed in-situ evidence. We therefore reframe haptics as a museum-facing mediation layer and deliver three transferable outputs: an integrated System–Mechanism–Outcome taxonomy, an evaluation ecology map, and a minimum reporting set to support deployable HM-IME design, more consistent validation across settings, and cumulative cross-study comparability.", "stars": 2, "rev": true, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n29", "group": "B 遗产 × VR / AR × AI", "en": "Signals of AI Hallucination: Designing Hallucination-Aware Cues for Embodied Conversational Agents in VR", "zh": "AI幻觉信号：面向VR中具身对话代理的幻觉感知线索设计", "venue": "ISMAR 2026（IEEE TVCG）", "doi": [], "url": "https://arxiv.org/abs/2609.28812", "abstract": "由大语言模型（LLM）驱动的对话代理（CA）通常会在回复的同时呈现不确定性线索和来源线索，以帮助用户评估回复的可靠性并识别潜在的幻觉。在虚拟现实（VR）等沉浸式环境中，对话代理往往以基于语音的具身对话代理（ECA）形式出现，此时不确定性与来源线索无法依赖持续显示的行内文本，通过语音传达时还可能被遗漏或干扰理解。我们开展了一项被试内研究（N = 24），将VR中ECA呈现幻觉感知信息（不确定性与来源）的三种设计与无线索基线进行比较：利用手势和姿态的具身线索、利用视觉标识的图标线索，以及采用颜色编码文本并附行内引用的文本线索。我们评估了这些设计如何影响用户识别幻觉相关信息的能力、对ECA的信任以及交互体验（沉浸感与任务负荷）。结果表明，三种设计均有助于用户识别幻觉。具身线索与更高的信任和沉浸感相关，文本线索的可解释性更清晰，而图标线索在保持相对良好可解释性的同时，与具身线索和文本线索相比对沉浸感的干扰更小。本研究通过比较沉浸式ECA场景中不同的幻觉线索设计，并考察其如何影响用户识别幻觉的能力与体验，为VR与人工智能研究社区做出了贡献，同时也为未来面向ECA的幻觉感知界面开发提供了实践启示与设计含义。", "abstract_en": "LLM-powered conversational agents (CAs) often present uncertainty and provenance cues alongside their responses to help users assess response reliability and identify potential hallucinations. In immersive environments such as Virtual Reality (VR), CAs often take the form of speech-based embodied conversational agents (ECAs), where uncertainty and provenance cues cannot rely on persistent inline text and may be missed or disrupt comprehension when delivered through speech. We conducted a within-subjects study (N = 24) to compare three designs for presenting the hallucination-awareness information (uncertainty and provenance) in ECAs in VR against a no-cue baseline: embodied cues using gestures and posture, icon cues using visual indicators, and text cues using color-coded text with inline citations. We evaluated how these designs affect users' ability to identify hallucination-related information, trust in the ECA, and interaction experience (immersion and task load). Our results show that all three designs support users in identifying hallucinations. Embodied cues were associated with higher trust and immersion, text cues offered clearer interpretability, and icon cues preserved relatively good interpretability while causing less disruption to immersion compared with embodied cues and text cues. This work contributes to the VR and AI research community by comparing different designs of hallucination cues in immersive ECA settings and examining how they affect users' ability and experiences to identify hallucinations. It also offers practical insights and design implications for developing future hallucination-awareness interfaces for ECA.", "stars": 3, "rev": false, "rank": "JCR Q1 · IF 6.8 · CCF-A 期刊（TVCG，ISMAR 2026 录用）"}, {"id": "n30", "group": "B 遗产 × VR / AR × AI", "en": "GatheringSense: AI-Generated Imagery and Embodied Experiences for Understanding Literati Gatherings", "zh": "GatheringSense：以AI生成图像与具身体验理解文人雅集", "venue": "CHI 2026 全文", "doi": ["10.1145/3772318.3791037"], "url": "https://doi.org/10.1145/3772318.3791037", "abstract": "中国文人雅集是一种情境化的中国传统文化形态，目前对其研究仍不够深入。尽管生成式AI支持强大的多模态生成，但现有文化应用大多侧重于审美层面的再现，难以传达文化仪式与社会框架的深层意涵。基于具身认知，我们提出一种AI驱动的文化理解双路径框架，并通过文人雅集体验GatheringSense对其进行实例化。我们开展了一项混合方法研究（N = 48），比较AI生成的多模态内容与具身参与在支持理解文人雅集、促进文化共鸣方面如何相互补充。结果表明，AI生成内容能有效提升文化符号的可读性和初始情感吸引力，但其在物理连贯性和微观层面可信度上的局限可能影响用户满意度。相比之下，具身体验显著加深了参与者对仪式规则与社会角色的理解，并增强了其心理亲近感和临场感。基于这些发现，我们为文化遗产领域的生成式体验提供了实证证据和五项可迁移的设计启示。", "abstract_en": "Chinese literati gatherings (Wenren Yaji), as a situated form of Chinese traditional culture, remain underexplored in depth. Although generative AI supports powerful multimodal generation, current cultural applications largely emphasize aesthetic reproduction and struggle to convey the deeper meanings of cultural rituals and social frameworks. Based on embodied cognition, we propose an AI-driven dual-path framework for cultural understanding, which we instantiate through GatheringSense, a literati-gathering experience. We conduct a mixed-methods study (N = 48) to compare how AI-generated multimodal content and embodied participation complement each other in supporting the understanding of literati gatherings and fostering cultural resonance. Our results show that AI-generated content effectively improves the readability of cultural symbols and initial emotional attraction, yet limitations in physical coherence and micro-level credibility may affect users’ satisfaction. In contrast, embodied experience significantly deepens participants’ understanding of ritual rules and social roles, and increases their psychological closeness and presence. Based on these findings, we offer empirical evidence and five transferable design implications for generative experience in cultural heritage.", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n32", "group": "B 遗产 × VR / AR × AI", "en": "CECL: a chain-based framework for learning-oriented extended reality in cultural heritage and its empirical evaluation", "zh": "CECL：面向文化遗产学习的扩展现实链式框架及其实证评估", "venue": "npj Heritage Science，2026", "doi": ["10.1038/s40494-026-02726-x"], "url": "https://www.nature.com/articles/s40494-026-02726-x", "abstract": "本研究提出CECL，一种面向学习的文化遗产XR链式框架，该框架在认知负荷约束下将文化语义转化为学习目标、任务结构和交互支架。以无锡的Helv City为对象，我们开发了两个内容等效的VR系统，并对84名参与者开展了对照实验。通过前测、后测和两周延迟测验评估学习效果，并采用NASA-TLX、外在负荷分量表和可穿戴脑电（EEG）测量认知负荷。与展示型VR相比，教育型VR提高了即时学习效果（Δ = 6.4，g = 0.62，p = 0.002）和保持效果（Δ = 5.1，g = 0.55，p = 0.006），同时降低了外在负荷（Δ = −7.8，g = 0.48，p = 0.012）。这些结果表明，面向学习的XR取决于结构化的语义转译与负荷调节，而非仅仅依靠沉浸感。", "abstract_en": "This study proposed CECL, a chain-based framework for learning-oriented cultural heritage XR that translated cultural semantics into learning objectives, task structures, and interaction scaffolds under cognitive-load constraints. Using Helv City in Wuxi, we developed two content-equivalent VR systems and conducted a controlled experiment with 84 participants. Learning was assessed through pre-, post-, and two-week delayed tests, while cognitive load was measured using NASA-TLX, an extraneous-load subscale, and wearable EEG. Compared with display-oriented VR, educational VR improved immediate learning (Δ = 6.4, g = 0.62, p = 0.002) and retention (Δ = 5.1, g = 0.55, p = 0.006), while reducing extraneous load (Δ = −7.8, g = 0.48, p = 0.012). These findings show that learning-oriented XR depends on structured semantic translation and load regulation rather than immersion alone.", "stars": 2, "rev": false, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n33", "group": "B 遗产 × VR / AR × AI", "en": "Narrative as cognitive infrastructure reduces semantic opacity in virtual industrial heritage", "zh": "叙事作为认知基础设施降低虚拟工业遗产中的语义不透明性", "venue": "npj Heritage Science，2026", "doi": ["10.1038/s40494-026-02352-7"], "url": "https://www.nature.com/articles/s40494-026-02352-7", "abstract": "数字遗产往往优先考虑视觉保真度，而忽视阐释的清晰性。本研究考察由交互式非玩家角色（NPC）提供的同步叙事能否降低虚拟工业遗产中的语义不透明性。基于北京首钢园的VR重建，三十名参与者被随机分配至NPC引导组或无引导探索组。多模态测量包括视线追踪、心率变异性、皮肤电活动、呼吸、体验后问卷，以及采用认知网络分析（ENA）进行分析的概念性反思。结果表明，NPC增加了对叙事相关特征的注视次数和停留时间，引发了更强的唤醒和努力反应，并提高了对历史与设计理解的评分。ENA显示概念网络更为稠密、整合程度更高，而结构方程模型表明视线与生理指标起到部分中介作用。这些发现表明，与具身注意同步的叙事在遗产阐释中发挥着类似认知基础设施的作用，将可见性转化为理解，并为评估沉浸式环境中的阐释质量提供了可复制的方案。", "abstract_en": "Digital heritage often prioritizes visual fidelity while neglecting interpretive clarity. This study examines whether synchronized narrative, delivered by interactive non-player characters (NPCs), can reduce semantic opacity in virtual industrial heritage. Using a VR reconstruction of Beijing’s Shougang Park, thirty participants were randomly assigned to NPC-guided or unguided exploration. Multimodal measures included gaze tracking, heart rate variability, electrodermal activity, respiration, post-experience questionnaires, and conceptual reflections analyzed with Epistemic Network Analysis (ENA). Results showed that NPCs increased fixation counts and dwell times on narrative-relevant features, elicited stronger arousal and effort responses, and improved ratings of historical and design understanding. ENA revealed denser, more integrated conceptual networks, while structural equation modeling indicated partial mediation by gaze and physiology. These findings demonstrate that narrative, synchronized with embodied attention, serves a role analogous to cognitive infrastructure in heritage interpretation, transforming visibility into understanding and offering a replicable protocol for evaluating interpretive quality in immersive environments.", "stars": 2, "rev": false, "rank": "JCR Q1* · IF 5.2（按原刊 Heritage Science；npj 新刊号暂无独立 IF）"}, {"id": "n31", "group": "B 遗产 × VR / AR × AI", "en": "Icebreaking: Building Trust and Empathy with Virtual Museum Embodied Conversational Agents via Personalized Initial Interactions", "zh": "破冰：通过个性化初始交互在虚拟博物馆具身对话代理中建立信任与共情", "venue": "ISMAR 2025", "doi": ["10.1109/ISMAR67309.2025.00122"], "url": "https://doi.org/10.1109/ISMAR67309.2025.00122", "abstract": "具身对话代理（ECA）在提升虚拟博物馆用户体验方面具有巨大潜力。然而，如何在初次相遇的关键时刻有效建立用户的信任与共情，仍是一项关键挑战。现有研究对通过个性化破冰策略系统性培养这些特质关注有限，往往集中于代理的外观或引导机制。本文研究了一种多模态个性化初始交互策略——整合基于用户兴趣的个性化开场、引导式自我披露和自适应具身社交仪式——对用户信任ECA导览员及对其产生共情的影响。我们将该策略实现于以北京中轴线为主题的VR虚拟博物馆中，由名为“小梁”的ECA导览员主导交互。在一项用户研究（$N=60$）中，我们比较了三种条件：（1）无初始交互（对照）、（2）标准化交互和（3）个性化交互。交互结束后立即使用成熟的心理量表测量用户的信任与共情。结果清晰表明，与对照组和标准化交互组相比，个性化初始交互显著提升了用户信任（$p<0.05$）和共情（$p<0.05$）。这些发现证实，在交互早期对话语与具身行为的整合进行个性化，是建立积极的用户—代理关系的有效途径。此外，本研究为设计更可信、更具共情力的ECA初始交互提供了有价值的见解，对现有ECA交互范式做出了重要贡献。", "abstract_en": "Embodied Conversational Agents (ECAs) show significant potential for enhancing user experience in virtual museums. However, effectively establishing user trust and empathy during the critical initial moments of encounter remains a key challenge. Existing research has paid limited attention to systematically fostering these qualities through personalized Icebreaking strategies, often focusing instead on agent appearance or guidance mechanisms. This paper investigates the impact of a multimodal personalized initial interaction strategy—integrating personalized openings based on user interests, guided self-disclosure, and adaptive embodied social rituals—on users' trust in and empathy towards an ECA guide. We implemented this strategy within a VR virtual museum themed around the Beijing Central Axis, featuring interactions led by an ECA guide named “Xiao Liang.” In a user study ($N=60$), we compared three conditions: (1) No initial interaction (control), (2) Standardized interaction, and (3) Personalized interaction. User trust and empathy were measured immediately post-interaction using established psychological scales. Results clearly demonstrated that the personalized initial interaction significantly enhanced both user trust ($p<0.05$) and empathy ($p<0.05$) compared to both the control and standardized interaction groups. These findings confirm that personalizing the integration of dialogue and embodied behaviors early in the interaction is an effective pathway for building positive user-agent relationships. Furthermore, this work provides valuable insights for designing more trustworthy and empathic initial interactions for ECAs, offering a significant contribution to existing ECA interaction paradigms.", "stars": 2, "rev": false, "rank": "CCF-B 会议"}, {"id": "r6", "group": "C 人怎么看待和使用 AI 证据", "en": "When combinations of humans and AI are useful: A systematic review and meta-analysis", "zh": "人类与人工智能的组合何时有效：系统综述与元分析", "venue": "Nature Human Behaviour，2024（系统综述＋元分析）", "doi": ["10.1038/s41562-024-02024-1"], "url": "https://www.nature.com/articles/s41562-024-02024-1", "abstract": "随着人工智能（AI）用于增强人类能力的情形日益增多，研究者已对涉及不同任务、系统和人群的人机 AI 系统展开研究。尽管相关研究数量庞大，我们仍缺乏一个宽泛的概念性认识，来说明人类与 AI 的组合何时优于二者单独行动。为回答这一问题，我们开展了一项预注册的系统综述与元分析，涵盖 106 项实验研究，共报告 370 个效应量。我们检索了跨学科的数据库集合（美国计算机协会数字图书馆、Web of Science 和信息系统协会电子图书馆），时间范围为 2020 年 1 月 1 日至 2023 年 6 月 30 日发表的研究。每项研究都须包含一项原创的人类被试实验，且该实验评估了人类单独、AI 单独以及人类与 AI 组合的表现。第一，我们发现平均而言，人类与 AI 的组合的表现显著差于人类或 AI 单独行动中较优者（Hedges’ g = −0.23；95% 置信区间，−0.39 至 −0.07）。第二，我们发现涉及决策的任务出现了表现损失，而涉及内容创作的任务则获得了显著更大的收益。最后，当人类单独表现优于 AI 时，组合带来了表现提升；而当 AI 单独表现优于人类时，则出现了损失。此处所评估证据的局限包括可能存在的发表偏倚以及所分析研究设计的差异。总体而言，这些发现凸显了人机协作效应的异质性，并为改进人机 AI 系统指出了有前景的途径。Vaccaro 等人对人类与 AI 组合的表现进行了系统综述与元分析，发现平均而言，人类与 AI 的组合的表现显著差于人类或 AI 单独行动中较优者。他们还发现，决策任务中出现了表现损失，而内容创作任务中的收益则显著更大。", "abstract_en": "Inspired by the increasing use of artificial intelligence (AI) to augment humans, researchers have studied human–AI systems involving different tasks, systems and populations. Despite such a large body of work, we lack a broad conceptual understanding of when combinations of humans and AI are better than either alone. Here we addressed this question by conducting a preregistered systematic review and meta-analysis of 106 experimental studies reporting 370 effect sizes. We searched an interdisciplinary set of databases (the Association for Computing Machinery Digital Library, the Web of Science and the Association for Information Systems eLibrary) for studies published between 1 January 2020 and 30 June 2023. Each study was required to include an original human-participants experiment that evaluated the performance of humans alone, AI alone and human–AI combinations. First, we found that, on average, human–AI combinations performed significantly worse than the best of humans or AI alone (Hedges’ g = −0.23; 95% confidence interval, −0.39 to −0.07). Second, we found performance losses in tasks that involved making decisions and significantly greater gains in tasks that involved creating content. Finally, when humans outperformed AI alone, we found performance gains in the combination, but when AI outperformed humans alone, we found losses. Limitations of the evidence assessed here include possible publication bias and variations in the study designs analysed. Overall, these findings highlight the heterogeneity of the effects of human–AI collaboration and point to promising avenues for improving human–AI systems. Vaccaro et al. present a systematic review and meta-analysis of the performance of human–AI combinations, finding that on average, human–AI combinations performed significantly worse than the best of humans or AI alone. They also found performance losses in decision-making tasks and significantly greater gains in content creation tasks.", "stars": 3, "rev": true, "rank": "JCR Q1 · IF 17.5"}, {"id": "n60", "group": "C 人怎么看待和使用 AI 证据", "en": "Do People Appropriately Rely on AI-Advice? An Analytical Review of HCI Research on Human-AI Decision-Making", "zh": "人们能恰当地依赖AI建议吗？人机决策HCI研究的分析性综述", "venue": "CHI 2026 全文 · Honorable Mention（分析性综述）", "doi": ["10.1145/3772318.3791467"], "url": "https://doi.org/10.1145/3772318.3791467", "abstract": "AI系统正越来越多地被定位为辅助人们决策的工具。然而，近期的实证研究显示出一个关键隐忧：人们过度依赖AI建议，而没有对其进行分析性的审视。尽管HCI研究探讨了人们如何依赖AI建议，但我们认为，它在很大程度上忽视了一个重要方面：复现真实的决策场景。人机交互因素会影响人们对AI建议的依赖。为理解人机交互因素及其相互作用，我们对人机依赖文献中的近期研究进行了分析性综述，分析了这些研究中的决策任务及其在面向应用情境中的效度。我们的发现表明，用户参与是依赖AI建议的宝贵资源，但也需要付出代价。我们还讨论了促成“恰当依赖”（appropriate reliance）的因素、现有的研究空白，以及人机依赖干预设计的建议。我们的工作为构建对AI建议的恰当依赖这一重要研究领域做出了贡献。", "abstract_en": "AI systems are increasingly being positioned to assist people in decision-making. However, recent empirical studies show critical concerns that people over-rely on AI advice without analytically engaging with it. While HCI research explores how people rely on AI advice, we argue that it largely overlooks an important aspect: replicating realistic decision-making scenarios. Human-AI interaction factors influence people’s reliance on AI advice. To understand human-AI interaction factors and their interplay, we conducted an analytical review of recent studies in human-AI reliance literature. We analyzed the decision-making tasks in research and their validity in application-grounded contexts. Our findings show that user engagement is a precious commodity for relying on AI advice; however, it comes at a cost. We also discuss factors contributing to “appropriate reliance”, existing research gaps, and recommendations for intervention design for human-AI reliance. Our work contributes to the critical body of research on building appropriate reliance on AI advice.", "stars": 3, "rev": true, "rank": "CCF-A 会议"}, {"id": "r7", "group": "C 人怎么看待和使用 AI 证据", "en": "A Systematic Review on Fostering Appropriate Trust in Human-AI Interaction: Trends, Opportunities and Challenges", "zh": "促进人机 AI 交互中恰当信任的系统综述：趋势、机遇与挑战", "venue": "ACM Journal on Responsible Computing，2024（系统综述）", "doi": ["10.1145/3696449"], "url": "https://doi.org/10.1145/3696449", "abstract": "人工智能（AI）系统中的恰当信任（appropriate trust）已迅速成为研究者和实践者共同关注的重要领域。人们已采用多种方法来实现恰当信任，例如置信度分数、解释、可信度线索和不确定性沟通。然而，由于影响该领域的各种背景带来了视角的多样性，且恰当信任缺乏统一定义，该领域仍缺乏全面的理解。为研究这一主题，本文开展了一项系统综述，以识别构建恰当信任的现行做法、衡量恰当信任的不同方式、所使用的任务类型以及与之相关的潜在挑战。我们还提出了“信念、意图与行动”（Belief, Intentions, and Actions）映射，通过（a）描述恰当信任定义上的现有分歧，以及（b）概述现有文献中与 AI 恰当信任相关的概念和定义，来研究相关概念的共性与差异。最后，我们讨论了研究恰当信任时发现的挑战，并将观察结果归纳为当前趋势、潜在空白以及未来工作的研究机遇。总体而言，本文为理解人机交互中恰当信任这一复杂概念提供了见解，并提出了推进我们对该主题认识的研究机遇。", "abstract_en": "Appropriate trust in Artificial Intelligence (AI) systems has rapidly become an important area of focus for both researchers and practitioners. Various approaches have been used to achieve it, such as confidence scores, explanations, trustworthiness cues, and uncertainty communication. However, a comprehensive understanding of the field is lacking due to the diversity of perspectives arising from various backgrounds that influence it and the lack of a single definition for appropriate trust. To investigate this topic, this article presents a systematic review to identify current practices in building appropriate trust, different ways to measure it, types of tasks used, and potential challenges associated with it. We also propose a Belief, Intentions, and Actions mapping to study commonalities and differences in the concepts related to appropriate trust by (a) describing the existing disagreements on defining appropriate trust, and (b) providing an overview of the concepts and definitions related to appropriate trust in AI from the existing literature. Finally, the challenges identified in studying appropriate trust are discussed, and observations are summarized as current trends, potential gaps, and research opportunities for future work. Overall, the article provides insights into the complex concept of appropriate trust in human-AI interaction and presents research opportunities to advance our understanding on this topic.", "stars": 2, "rev": true, "rank": "暂无 JCR 分区（ACM 新刊）"}, {"id": "n54", "group": "C 人怎么看待和使用 AI 证据", "en": "Narratives and Perspectives: How AI Summaries Steer Users' Opinions and Engagement on Social Media", "zh": "叙事与视角：AI摘要如何引导用户在社交媒体上的观点与参与", "venue": "CHI 2026 全文 · Best Paper", "doi": ["10.1145/3772318.3790945"], "url": "https://doi.org/10.1145/3772318.3790945", "abstract": "社交媒体上的AI摘要正在重塑用户对政治话题形成观点的方式，但尽管其已被广泛部署，其影响在很大程度上仍未得到检验。本文考察了两类AI摘要如何影响用户的观点与参与：讨论叙事的文本摘要，以及赞同/反对的百分比统计。通过一项在模拟在线讨论帖上开展的144名参与者的实验，我们发现，展示评论者的赞同百分比会使用户对多数观点的社会从众（social conformity）程度超过仅阅读评论时的水平。相反，AI叙事摘要会在两极分化的讨论帖中造成对观点均衡的误判，从而减少观点改变。尽管这些摘要并未影响参与者的参与意愿，但有毒（toxic）讨论会阻碍参与，即使参与者持有多数观点亦然。基于研究发现，我们为业界与研究者提出了关键的设计干预建议，以缓解这类工具的极化效应，为社交媒体平台负责任地部署AI铺平道路。", "abstract_en": "AI summaries on social media are reshaping how users form opinions about political topics, yet their influence remains largely unexamined despite their widespread deployment. This paper investigates how two types of AI summaries affect user opinions and engagement: textual summaries of discussion narratives and percentage breakdowns of agreement/disagreement. Through a 144-participant experiment on simulated online discussion threads, we found that displaying commenter agreement percentages amplified social conformity towards the majority views beyond reading comments alone. Conversely, AI narrative summaries created misperceptions of balance in polarised threads, reducing opinion change. While these summaries did not influence participants’ willingness to engage, toxic discussions deterred participation even when participants held majority views. Based on our findings, we provide critical design interventions for industry and researchers to mitigate these tools’ polarising effects, paving the way for responsible AI deployment on social media platforms.", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n55", "group": "C 人怎么看待和使用 AI 证据", "en": "Dialogues with AI Reduce Beliefs in Misinformation but Build No Lasting Discernment Skills", "zh": "与AI对话可减少对虚假信息的相信，但无法培养持久的辨别能力", "venue": "CHI 2026 全文 · Honorable Mention", "doi": ["10.1145/3772318.3790656"], "url": "https://doi.org/10.1145/3772318.3790656", "abstract": "随着虚假信息日益泛滥，包括越来越逼真的AI生成新闻，亟需训练人们更好地评估和识别虚假信息。已有研究表明，与AI的交互能够持久地降低人们对虚假信息的相信程度，但这些交互是否同时教会人们自行辨别虚假信息的技能，尚不清楚。我们开展了一项为期一个月的研究：67名参与者将新闻标题—图片对分类为真实或虚假，与一个AI系统讨论其判断，随后对未见过的新闻项目进行无辅助评估，以测量AI辅助之前、期间和之后的准确率。虽然AI辅助在辅助环节中带来了即时提升（平均提高21%），但参与者在新项目上的无辅助表现在第4周相比第0周显著下降了15.3%。这些结果表明，尽管AI可能带来即时帮助，但最终可能削弱长期的虚假信息识别能力。", "abstract_en": "Given the growing prevalence of fake information, including increasingly realistic AI-generated news, there is an urgent need to train people to better evaluate and detect misinformation. While interactions with AI have been shown to durably reduce people’s beliefs in false information, it is unclear whether these interactions also teach people the skills to discern false information themselves. We conducted a month-long study where 67 participants classified news headline-image pairs as real or fake, discussed their assessments with an AI system, followed by an unassisted evaluation of unseen news items to measure accuracy before, during, and after AI assistance. While AI assistance produced immediate improvements during AI-assisted sessions (+21% average), participants’ unassisted performance on new items declined significantly by 15.3% in week 4 compared to week 0. These results indicate that while AI may help immediately, it may ultimately degrade long-term misinformation detection abilities.", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n56", "group": "C 人怎么看待和使用 AI 证据", "en": "PaperTrail: A Claim-Evidence Interface for Grounding Provenance in LLM-based Scholarly Q&A", "zh": "PaperTrail：一种用于为基于LLM的学术问答提供溯源依据的主张—证据界面", "venue": "CHI 2026 全文", "doi": ["10.1145/3772318.3791101"], "url": "https://doi.org/10.1145/3772318.3791101", "abstract": "大语言模型（LLM）越来越多地被用于学术问答（QA）系统，以帮助研究者综合海量文献。然而，这些系统常常产生细微的错误（如无依据的主张、遗漏错误），而诸如来源引用之类的现有溯源机制，其粒度不足以满足学术领域所要求的严格核查。为此，我们提出PaperTrail，这是一种新颖的界面，它将LLM的回答和来源文档均分解为离散的主张与证据，并建立二者之间的映射，以揭示有依据的论断、无依据的主张以及来源文本中被遗漏的信息。我们通过一项被试内研究对PaperTrail进行了评估：26名研究者使用PaperTrail和基线界面完成两项学术编辑任务。结果表明，与基线相比，PaperTrail显著降低了参与者的信任。然而，这种更加谨慎的态度并未转化为行为上的改变，人们为了避免一项认知负担沉重的任务，仍然依赖LLM生成的学术编辑内容。我们讨论了主张—证据匹配对于理解学术情境中LLM可信度的价值，并提出了面向认知友好的溯源信息呈现的设计启示。", "abstract_en": "Large language models (LLMs) are increasingly used in scholarly question-answering (QA) systems to help researchers synthesize vast amounts of literature. However, these systems often produce subtle errors (e.g., unsupported claims, errors of omission), and current provenance mechanisms like source citations are not granular enough for the rigorous verification that scholarly domain requires. To address this, we introduce PaperTrail, a novel interface that decomposes both LLM answers and source documents into discrete claims and evidence, mapping them to reveal supported assertions, unsupported claims, and information omitted from the source texts. We evaluated PaperTrail in a within-subjects study with 26 researchers who performed two scholarly editing tasks using PaperTrail and a baseline interface. Our results show that PaperTrail significantly lowered participants’ trust compared to the baseline. However, this increased caution did not translate to behavioral changes, as people continued to rely on LLM-generated scholarly edits to avoid a cognitively burdensome task. We discuss the value of claim-evidence matching for understanding LLM trustworthiness in scholarly settings, and present design implications for cognition-friendly communication of provenance information.", "stars": 3, "rev": false, "rank": "CCF-A 会议"}, {"id": "n57", "group": "C 人怎么看待和使用 AI 证据", "en": "Behavioral Indicators of Overreliance During Interaction with Conversational Language Models", "zh": "与对话式语言模型交互过程中过度依赖的行为指标", "venue": "CHI 2026 全文", "doi": ["10.1145/3772318.3790332"], "url": "https://doi.org/10.1145/3772318.3790332", "abstract": "LLM如今已嵌入广泛的日常场景。然而，其固有的幻觉可能将错误信息隐藏在流畅的回答之中，引发了对AI过度依赖（overreliance）的担忧。检测过度依赖具有挑战性，因为它往往出现在复杂、动态的情境中，难以通过事后的任务结果轻易捕捉。在本研究中，我们旨在探究用户的行为模式与过度依赖之间的关联。我们收集了77名参与者在三项真实任务中使用一个被注入了看似合理的错误信息的LLM的交互日志，并以参与者是否发现并纠正这些错误来评估过度依赖。通过对用户交互片段进行语义编码与聚类，我们识别出与过度依赖相关的五种行为模式：低过度依赖的用户表现出细致的任务理解和细粒度的导航；高过度依赖的用户则表现为频繁复制粘贴、跳过初始理解、反复引用LLM、粗略定位，以及在犹豫的情况下仍接受错误信息。我们讨论了缓解过度依赖的设计启示。", "abstract_en": "LLMs are now embedded in a wide range of everyday scenarios. However, their inherent hallucinations risk hiding misinformation in fluent responses, raising concerns about overreliance on AI. Detecting overreliance is challenging, as it often arises in complex, dynamic contexts and cannot be easily captured by post-hoc task outcomes. In this work, we aim to investigate how users’ behavioral patterns correlate with overreliance. We collected interaction logs from 77 participants working with an LLM injected plausible misinformation across three real-world tasks and we assessed overreliance by whether participants detected and corrected these errors. By semantically encoding and clustering segments of user interactions, we identified five behavioral patterns linked to overreliance: users with low overreliance show careful task comprehension and fine-grained navigation; users with high overreliance show frequent copy-paste, skipping initial comprehension, repeated LLM references, coarse locating, and accepting misinformation despite hesitation. We discuss design implications for mitigation.", "stars": 2, "rev": false, "rank": "CCF-A 会议"}, {"id": "n58", "group": "C 人怎么看待和使用 AI 证据", "en": "Show me the evidence: Evaluating the role of evidence and natural language explanations in AI-supported fact-checking", "zh": "让我看看证据：评估证据与自然语言解释在AI辅助事实核查中的作用", "venue": "FAccT 2026", "doi": ["10.1145/3805689.3812358"], "url": "https://doi.org/10.1145/3805689.3812358", "abstract": "尽管已有大量研究聚焦于AI解释如何支持事实核查等复杂信息查找任务中的决策，但证据所起的作用却出人意料地缺乏研究。在我们的研究中，我们针对非专家参与者系统地操纵了解释类型、AI预测的确定性以及AI系统建议的正确性，参与者需评估论断的真实性及AI系统的预测。参与者可以选择便捷地查看底层证据。我们发现，在所有实验条件下，参与者始终依靠证据来验证AI的论断。当呈现自然语言解释时，证据的使用频率有所降低，但当这些解释显得不足或存在缺陷时，参与者仍会依靠证据。定性数据表明，尽管证据来源的身份被刻意隐去，参与者仍试图推断证据来源的可靠性。我们的结果表明，证据是人们评估AI系统所呈现信息可靠性的关键要素，并且与自然语言解释相结合时，能为决策提供有价值的支持。亟需开展进一步研究，以了解应如何呈现证据，以及人们在实践中如何与证据交互。", "abstract_en": "Although much research has focused on AI explanations to support decisions in complex information-seeking tasks such as fact-checking, the role of evidence is surprisingly under-researched. In our study, we systematically varied explanation type, AI prediction certainty, and correctness of AI system advice for non-expert participants, who evaluated the veracity of claims and AI system predictions. Participants were provided the option of easily inspecting the underlying evidence. We found that participants consistently relied on evidence to validate AI claims across all experimental conditions. When participants were presented with natural language explanations, evidence was used less frequently although they relied on it when these explanations seemed insufficient or flawed. Qualitative data suggests that participants attempted to infer evidence source reliability, despite source identities being deliberately omitted. Our results demonstrate that evidence is a key ingredient in how people evaluate the reliability of information presented by an AI system and, in combination with natural language explanations, offers valuable support for decision-making. Further research is urgently needed to understand how evidence ought to be presented and how people engage with it in practice.", "stars": 2, "rev": false, "rank": "未入 CCF 目录（AI 公平与问责领域顶会）"}]};

/* ---------- paper list (base + added) ---------- */
let P=[], byId={}, GROUPS=[];
const DEFAULT_GROUP={}; function initDefaults(){ DATA.papers.forEach(p=>DEFAULT_GROUP[p.id]=p.group); }
function rebuild(){
  S.moved=S.moved||{};
  DATA.papers.forEach(p=>p.group=S.moved[p.id]||DEFAULT_GROUP[p.id]);
  S.trash=S.trash||{}; S.deleted=S.deleted||{};
  const all=[...DATA.papers,...S.custom].filter(p=>!S.trash[p.id]&&!S.deleted[p.id]);
  const present=[...new Set(all.map(p=>p.group))];
  const base=DATA.groups, order=(S.groupOrder||[]).filter(g=>present.includes(g));
  present.filter(g=>!order.includes(g)).forEach(g=>{
    if(base.includes(g)){
      let idx=0; for(let k=base.indexOf(g)-1;k>=0;k--){ const j=order.indexOf(base[k]); if(j>=0){idx=j+1;break;} }
      order.splice(idx,0,g);
    }else{ const j=order.indexOf(base[base.length-1]); if(j>=0) order.splice(j,0,g); else order.push(g); }
  });
  GROUPS=order;
  const pos={}; (S.paperOrder||[]).forEach((id,k)=>pos[id]=k);
  const def={}; all.forEach((p,k)=>def[p.id]=1e6+k);
  const key=p=>pos[p.id]??def[p.id];
  P=[]; GROUPS.forEach(g=>all.filter(p=>p.group===g).sort((a,b)=>key(a)-key(b)).forEach(p=>P.push(p)));
  P.forEach((p,k)=>p.n=k+1);
  byId=Object.fromEntries(P.map(p=>[p.id,p]));
  if(!byId[S.cur]) S.cur=P[0]?.id;
}
function paperUrl(p){
  if(p.url) return /^https?:/i.test(p.url)?p.url:(/^10\./.test(p.url)?"https://doi.org/"+p.url:"https://"+p.url);
  return p.doi&&p.doi[0]?"https://doi.org/"+p.doi[0]:"";
}
function yearVenue(v){
  if(!v) return ""; if(v.includes(" / ")) return v;
  const y=(v.match(/(19|20)\d\d/)||[""])[0], name=v.split("，")[0].replace(y,"").trim();
  return y?`${y} / ${name}`:name;
}
function defaults(p){
  const d=Array(14).fill("");
  d[0]=p.en+(p.zh?"\n中文："+p.zh:"");
  d[1]=yearVenue(p.venue);
  d[12]=paperUrl(p);
  return d;
}
function imgText(id){ return (S.images&&S.images[id]||[]).map(x=>"图片/"+x.file+(x.cap?"（"+x.cap+"）":"")).join("\n"); }
function getVals(id){ const p=byId[id], d=defaults(p), n=S.notes[id]||{}; const v=d.map((v,i)=>(i in n)?n[i]:v); v[IMG_COL]=imgText(id); return v; }
function detailOf(id,i){ return String(((S.notes[id]||{})[i+"d"])||""); }
function exportVals(id){
  const v=getVals(id);
  Object.keys(DETAIL).forEach(k=>{ const i=+k, d=detailOf(id,i).trim(); if(d) v[i]=v[i]?v[i]+"："+d:d; });
  return v;
}
function status(id){ const v=getVals(id), k=NOTE_IDX.filter(i=>String(v[i]).trim()).length; return k===0?"":(k===NOTE_IDX.length?"full":"part"); }

/* ---------- drag to reorder ---------- */
let DRAG=null;
const listEl=document.getElementById("list");
function clearDropMarks(){ listEl.querySelectorAll(".drop-before,.drop-after,.drop-into").forEach(e=>e.classList.remove("drop-before","drop-after","drop-into")); }
listEl.addEventListener("dragstart",e=>{
  const it=e.target.closest&&e.target.closest(".item"), gh=e.target.closest&&e.target.closest(".grp-h");
  if(it){ DRAG={type:"item",id:it.dataset.id}; it.classList.add("dragging"); }
  else if(gh){ DRAG={type:"grp",g:gh.parentElement.dataset.g}; gh.parentElement.classList.add("dragging"); }
  else return;
  e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain","move"); }catch(_){}
});
listEl.addEventListener("dragend",()=>{ DRAG=null; clearDropMarks(); listEl.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging")); });
function dropTarget(e){
  if(!DRAG) return null;
  if(DRAG.type==="item"){
    const it=e.target.closest(".item");
    if(it&&it.dataset.id!==DRAG.id){ const r=it.getBoundingClientRect(); return {el:it,kind:e.clientY<r.top+r.height/2?"before":"after"}; }
    const gh=e.target.closest(".grp-h"); if(gh) return {el:gh.parentElement,kind:"into"};
    return null;
  }
  const g=e.target.closest(".grp"); if(!g||g.dataset.g===DRAG.g) return null;
  const r=g.getBoundingClientRect(); return {el:g,kind:e.clientY<r.top+Math.min(r.height/2,40)?"before":"after"};
}
listEl.addEventListener("dragover",e=>{
  const t=dropTarget(e); clearDropMarks(); if(!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move"; t.el.classList.add("drop-"+t.kind);
});
listEl.addEventListener("drop",e=>{
  const t=dropTarget(e); clearDropMarks(); if(!t) return; e.preventDefault();
  if(DRAG.type==="item"){
    const ids=P.map(p=>p.id).filter(id=>id!==DRAG.id); let idx, g;
    if(t.kind==="into"){ g=t.el.dataset.g; const inG=P.filter(p=>p.group===g&&p.id!==DRAG.id); idx=inG.length?ids.indexOf(inG[inG.length-1].id)+1:ids.length; if(S.closed[g]){ S.closed[g]=false; } }
    else { const tid=t.el.dataset.id; g=byId[tid].group; idx=ids.indexOf(tid)+(t.kind==="after"?1:0); }
    ids.splice(idx,0,DRAG.id);
    const c=S.custom.find(c=>c.id===DRAG.id);
    if(c) c.group=g; else { if(g===DEFAULT_GROUP[DRAG.id]) delete S.moved[DRAG.id]; else S.moved[DRAG.id]=g; }
    S.paperOrder=ids;
  }else{
    const gs=GROUPS.filter(x=>x!==DRAG.g); const j=gs.indexOf(t.el.dataset.g)+(t.kind==="after"?1:0);
    gs.splice(j,0,DRAG.g); S.groupOrder=gs; S.paperOrder=P.map(p=>p.id);
  }
  DRAG=null; S.metaT=Date.now(); rebuild(); persist(); renderList(); if(S.view==="lit") open(S.cur); else renderStats();
});
listEl.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&(e.target.classList.contains("item")||e.target.classList.contains("grp-h"))){ e.preventDefault(); e.target.click(); } });

async function exportKP(){
  const {zip,count}=kpXlsx(); if(!count) return "";
  const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const fname="知识点汇总.xlsx";
  if(SERVER){
    const r=await fetch("/api/export?overwrite=1&name="+encodeURIComponent(fname),{method:"POST",body:blob});
    if(r.status===423) return "（知识点汇总.xlsx 正在 Excel 里开着，没更新）";
    if(r.ok) return `，知识点 ${count} 条存进「知识点汇总.xlsx」`;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  return "，知识点已另外下载";
}

/* ---------- images ---------- */
function slug(s){ return String(s||"paper").normalize("NFKD").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"paper"; }
function stamp(){ const d=new Date(),z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
const IMGCACHE={};
async function imgBlobUrl(f){
  if(IMGCACHE[f]) return IMGCACHE[f];
  if(!GH.ready){ const b=await idbGet(f); if(!b) throw new Error("no local image"); return IMGCACHE[f]=URL.createObjectURL(b); }
  const r=await gh("/contents/images/"+encodeURIComponent(f),{headers:{Accept:"application/vnd.github.raw+json"}});
  if(!r.ok) throw new Error(r.status);
  return IMGCACHE[f]=URL.createObjectURL(await r.blob());
}
function renderImgs(id){
  const box=document.getElementById("imgs"); if(!box) return;
  const list=(S.images&&S.images[id])||[];
  box.innerHTML=list.map((x,k)=>`<figure class="imgcard">
      <img alt="${esc(x.cap||x.file)}" data-k="${k}" data-file="${esc(x.file)}">
      <input class="cap" data-k="${k}" placeholder="写一句说明，如：图3 实验流程" value="${esc(x.cap||"")}">
      <button class="del" data-k="${k}" title="从这篇的笔记里移除">×</button>
    </figure>`).join("");
  box.querySelectorAll("img").forEach(im=>{ im.onclick=()=>{ if(im.src) lightbox(im.src,list[+im.dataset.k]); }; imgBlobUrl(im.dataset.file).then(u=>im.src=u).catch(()=>{ im.alt="图片加载失败（联网后刷新）"; }); });
  box.querySelectorAll(".cap").forEach(inp=>inp.addEventListener("input",()=>{ list[+inp.dataset.k].cap=inp.value; touch(id); persistSoon(); }));
  box.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{
    const x=list[+b.dataset.k]; if(!confirm("移除这张图片？")) return;
    list.splice(+b.dataset.k,1); touch(id); persist(); renderImgs(id);
  });
}
async function addImages(id,files){
  if(!files.length) return;
  const p=byId[id]; S.images=S.images||{}; S.images[id]=S.images[id]||[];
  let ok=0; if(GH.ready) toast("图片上传中…");
  for(let k=0;k<files.length;k++){
    const f=files[k], ext=((f.type.split("/")[1]||"png").replace("jpeg","jpg").replace(/[^a-z0-9]/g,""))||"png";
    const name=`${String(p.n).padStart(2,"0")}_${slug(p.en)}_${stamp()}${files.length>1?"_"+(k+1):""}.${ext}`;
    try{
      if(GH.ready){
        const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(f); });
        await ghPutRaw("images/"+name,b64,null,"add image "+name);
      } else await idbPut(name,f);
      IMGCACHE[name]=URL.createObjectURL(f);
      S.images[id].push({file:name,cap:""}); ok++;
    }catch(e){ toast("图片没传上："+(e.auth?"钥匙无效":"网络问题，请稍后再试")); }
  }
  if(ok){ touch(id); persist(); if(S.cur===id) renderImgs(id); toast(GH.ready?`已上传 ${ok} 张图片到私有仓库`:`已保存 ${ok} 张图片到本机浏览器`); }
}
document.addEventListener("paste",e=>{
  if(S.view!=="lit"||!e.clipboardData) return;
  const files=[...e.clipboardData.items].filter(it=>it.kind==="file"&&it.type.startsWith("image/")).map(it=>it.getAsFile()).filter(Boolean);
  if(!files.length) return;
  e.preventDefault(); addImages(S.cur,files);
});

function renderStats(){
  const vals=P.map(p=>({p,v:getVals(p.id),s:status(p.id)}));
  const started=vals.filter(x=>x.s).length, done=vals.filter(x=>x.s==="full").length;
  const kpi=(v,l)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const SER=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  const dataFor=i=>{
    const opts=CHOICES[i].slice();
    vals.forEach(x=>{ const t=String(x.v[i]).trim(); if(t&&!opts.includes(t)) opts.push(t); });
    const counts=opts.map(o=>vals.filter(x=>String(x.v[i]).trim()===o).length);
    return {opts,counts,blank:vals.filter(x=>!String(x.v[i]).trim()).length};
  };
  const drill=i=>{
    if(!(S.sel&&S.sel.i===i)) return "";
    const list=vals.filter(x=>String(x.v[i]).trim()===S.sel.v);
    return `<div class="drill"><div class="dt">「${esc(S.sel.v)}」的论文（点击打开）：</div>${list.length?list.map(x=>`<a data-id="${x.p.id}" title="${esc(x.p.en)}">${x.p.n}. ${esc(x.p.zh||x.p.en)}</a>`).join(""):'<span class="dt">暂无</span>'}</div>`;
  };
  const arc=(cx,cy,r0,r1,a0,a1)=>{
    const p=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)], big=a1-a0>Math.PI?1:0;
    const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
    return `M${x0},${y0}A${r1},${r1} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${big} 0 ${x3},${y3}Z`;
  };
  const donut=c=>{
    const {opts,counts,blank}=dataFor(c.i), total=counts.reduce((a,b)=>a+b,0), sel=S.sel&&S.sel.i===c.i?S.sel.v:null;
    const col=k=>k<CHOICES[c.i].length?SER[k]:"var(--other)";
    let svg;
    if(!total) svg=`<svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="66" fill="none" stroke="var(--grid)" stroke-width="28"/><text x="90" y="86" text-anchor="middle" font-size="13" fill="var(--faint)">还没有</text><text x="90" y="104" text-anchor="middle" font-size="13" fill="var(--faint)">填这一项</text></svg>`;
    else{
      let a=0; const segs=counts.map((n,k)=>{ if(!n) return ""; const a1=a+n/total*Math.PI*2;
        const d=n===total?`M90,24A66,66 0 1 1 89.99,24L89.99,52A38,38 0 1 0 90,52Z`:arc(90,90,38,80,a,a1); a=a1;
        return `<path d="${d}" fill="${col(k)}" stroke="var(--panel)" stroke-width="2" class="${sel&&sel!==opts[k]?"dim":""}" data-i="${c.i}" data-v="${esc(opts[k])}" data-tip="${esc(opts[k])}：${n} 篇（${Math.round(n/total*100)}%）"/>`; }).join("");
      svg=`<svg viewBox="0 0 180 180">${segs}<text x="90" y="88" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${total}</text><text x="90" y="108" text-anchor="middle" font-size="12.5" fill="var(--muted)">篇已填</text></svg>`;
    }
    const lg=opts.map((o,k)=>`<button class="lg-row ${sel===o?"on":""}" data-i="${c.i}" data-v="${esc(o)}"><i style="background:${col(k)}"></i><span>${esc(o)}</span><b>${counts[k]}</b><em>${total?Math.round(counts[k]/total*100)+"%":"–"}</em></button>`).join("");
    return `<div class="card chart-card viz"><h3>${c.t}</h3><div class="hint">${c.h} · 未填 ${blank} 篇</div>
      <div class="donut-wrap">${svg}<div class="lg">${lg}</div></div>${drill(c.i)}</div>`;
  };
  const columns=c=>{
    const {opts,counts,blank}=dataFor(c.i), max=Math.max(...counts), sel=S.sel&&S.sel.i===c.i?S.sel.v:null;
    const top=Math.max(4,Math.ceil(max/4)*4);
    return `<div class="card chart-card viz"><h3>${c.t}</h3><div class="hint">${c.h} · 未填 ${blank} 篇</div>
      <div class="cols">${opts.map((o,k)=>`<button class="vcol ${sel===o?"on":""}" data-i="${c.i}" data-v="${esc(o)}" data-tip="${esc(o)}：${counts[k]} 篇（点击查看）"><span class="v">${counts[k]}</span><span class="b" style="height:calc((100% - 24px) * ${counts[k]/Math.max(1,max)})"></span></button>`).join("")}</div>
      <div class="col-labels">${opts.map(o=>`<span>${o.includes(" / ")?esc(o).replace(" / ","/<br>"):(o.length===4?esc(o.slice(0,2))+"<br>"+esc(o.slice(2)):esc(o))}</span>`).join("")}</div>${drill(c.i)}</div>`;
  };
  const line=()=>{
    const fa=S.firstAt||{}, da=S.doneAt||{};
    const ids=new Set(P.map(p=>p.id));
    const f=Object.entries(fa).filter(([id])=>ids.has(id)).map(x=>x[1]), d=Object.entries(da).filter(([id])=>ids.has(id)).map(x=>x[1]);
    if(!f.length) return `<div class="card chart-card viz"><h3>阅读进度曲线</h3><div class="hint">每天累计写了几篇、填完几篇</div><div class="empty-chart">开始写笔记后，这里会按日期画出你的累计进度。</div></div>`;
    const start=new Date(f.slice().sort()[0]+"T00:00:00"), end=new Date(today()+"T00:00:00");
    const days=[]; for(let x=new Date(start);x<=end;x.setDate(x.getDate()+1)) days.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`);
    if(days.length===1){ const y=new Date(start); y.setDate(y.getDate()-1); days.unshift(`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`); }
    const cum=arr=>days.map(dd=>arr.filter(x=>x<=dd).length);
    const A=cum(f), B=cum(d), W=680, Hh=230, L=36, R=70, T=16, Bm=30, max=Math.max(4,Math.ceil(Math.max(...A)/4)*4);
    const X=k=>L+(days.length===1?0:k/(days.length-1)*(W-L-R)), Y=v=>T+(1-v/max)*(Hh-T-Bm);
    const grid=[0,1,2,3,4].map(g=>{ const v=max/4*g; return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${g?"var(--grid)":"var(--axis)"}" stroke-width="${g?1:1.5}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`; }).join("");
    const step=Math.max(1,Math.ceil(days.length/7));
    const xl=days.map((dd,k)=>(k%step===0||k===days.length-1)?`<text x="${X(k)}" y="${Hh-8}" text-anchor="middle">${+dd.slice(5,7)}/${+dd.slice(8)}</text>`:"").join("");
    const path=arr=>arr.map((v,k)=>`${k?"L":"M"}${X(k)},${Y(v)}`).join("");
    const dots=(arr,c,name)=>arr.map((v,k)=>`<circle cx="${X(k)}" cy="${Y(v)}" r="4.5" fill="${c}" stroke="var(--panel)" stroke-width="2" data-tip="${days[k]}　${name}：${v} 篇"/>`).join("");
    const hit=days.map((dd,k)=>`<rect x="${X(k)-8}" y="${T}" width="16" height="${Hh-T-Bm}" fill="transparent" data-tip="${dd}　已写笔记 ${A[k]} 篇 · 填完 ${B[k]} 篇"/>`).join("");
    return `<div class="card chart-card viz"><h3>阅读进度曲线</h3><div class="hint">每天累计写了几篇、填完几篇（从你写第一条笔记那天开始）</div>
      <div class="lg-inline"><span><i style="background:var(--s1)"></i>已写笔记（累计）</span><span><i style="background:var(--s2)"></i>10 项填完（累计）</span></div>
      <svg class="line-svg" viewBox="0 0 ${W} ${Hh}">${grid}${xl}
        <path d="${path(A)}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="${path(B)}" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linejoin="round"/>
        ${hit}${dots(A,"var(--s1)","已写笔记")}${dots(B,"var(--s2)","填完")}
        <text class="end" x="${X(days.length-1)+10}" y="${Y(A[A.length-1])+4}" fill="var(--ink)">${A[A.length-1]} 篇</text>
        <text class="end" x="${X(days.length-1)+10}" y="${Y(B[B.length-1])+(Math.abs(Y(A[A.length-1])-Y(B[B.length-1]))<16?20:4)}" fill="var(--ink)">${B[B.length-1]} 篇</text>
      </svg></div>`;
  };
  const stacks=GROUPS.map(g=>{ const it=vals.filter(x=>x.p.group===g); if(!it.length) return "";
    const f=it.filter(x=>x.s==="full").length, pt=it.filter(x=>x.s==="part").length, n=it.length-f-pt;
    const seg=(k,c,l)=>k?`<span style="width:${k/it.length*100}%;background:${c}" data-tip="${esc(g)}　${l}：${k} 篇"></span>`:"";
    return `<div class="stack-row"><span class="lab">${esc(g)}</span><span class="stack">${seg(f,"var(--done)","10 项填完")}${seg(pt,"var(--part)","写了一部分")}${seg(n,"var(--grid)","未写")}</span><span class="num">${f+pt} / ${it.length}</span></div>`; }).join("");
  document.getElementById("viewStats").innerHTML=`
    <h1>分类统计</h1>
    <div class="sub">根据你写的笔记实时统计，算法和 Excel「分类统计」页一致。点图上的扇区、柱子或图例，下面会列出对应的论文。</div>
    <div class="kpis">${kpi(P.length,"论文总数")}${kpi(started,"已写笔记")}${kpi(done,"10 项填完")}${kpi(P.length-started,"还没开始")}</div>
    <div class="charts">${columns(STAT_CHARTS[0])}${columns(STAT_CHARTS[1])}${columns(STAT_CHARTS[2])}${donut(STAT_CHARTS[3])}</div>
    <div style="margin-top:16px">${line()}</div>
    <div class="card chart-card viz" style="margin-top:16px"><h3>各分类阅读进度</h3><div class="hint">每个分类里：填完 / 写了一部分 / 未写</div>
      <div class="lg-inline"><span><i style="background:var(--done);height:10px;width:10px"></i>10 项填完</span><span><i style="background:var(--part);height:10px;width:10px"></i>写了一部分</span><span><i style="background:var(--grid);height:10px;width:10px"></i>未写</span></div>${stacks}</div>`;
}
