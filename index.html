<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>文献阅读工作台 · 遗产AI交互 2025–2026</title>
<style>
:root{
  color-scheme: light;
  --bg:#e8f1e3; --side:#f2f8ee; --panel:#fbfdf8; --ink:#1f2d25; --muted:#4f6157; --faint:#7a8b81;
  --line:#d5e2cf; --line2:#bfd1b8; --field:#ffffff;
  --accent:#1e6b5c; --accent-ink:#ffffff; --accent-soft:#d6eadf; --accent-mid:#9fcbb8;
  --hot:#d46d22; --hot-ink:#ffffff; --hot-soft:#fcecdc;
  --tip:#fff6dc; --tip-line:#e0aa2e;
  --part:#d08a1e; --done:#2e8b57; --bar:#2a8a76;
  --shadow:0 1px 2px rgba(40,60,40,.06),0 6px 22px rgba(40,60,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--sidew,370px) 8px 1fr 8px var(--kpw,360px);height:100vh}
.app.kp-off{grid-template-columns:var(--sidew,370px) 8px 1fr 0 0}
.app.kp-off .kp,.app.kp-off #resizer2{display:none}
.resizer{cursor:col-resize;background:transparent;position:relative;z-index:2}
.resizer::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--line)}
.resizer:hover::after,.resizer.drag::after{background:var(--accent);width:3px}
body.resizing{user-select:none;cursor:col-resize}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;color:var(--accent)}
.progress{margin-top:8px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:14.5px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn.hot{background:var(--hot);color:var(--hot-ink);border-color:var(--hot);font-weight:700;font-size:15.5px;padding:10px 18px;box-shadow:0 3px 10px rgba(212,109,34,.28)}
.btn.hot:hover{filter:brightness(1.07);color:var(--hot-ink)}
.btn.danger:hover{border-color:#b3412e;color:#b3412e}
.actions .btn.primary{flex:1;justify-content:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;background:var(--line);padding:4px;border-radius:11px}
.tab{border:0;background:transparent;border-radius:8px;padding:7px 0;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab svg{width:17px;height:17px}
.list{overflow:auto;flex:1;padding:8px 10px 24px}
.grp{margin-top:4px}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 10px;border-radius:9px;cursor:pointer;text-align:left;font-weight:700;font-size:15.5px;color:var(--accent)}
.grp-h:hover{background:var(--accent-soft)}
.grp-h .chev{width:11px;color:var(--accent);transition:transform .15s;flex:none}
.grp.closed .chev{transform:rotate(-90deg)}
.grp-h .cnt{margin-left:auto;font-weight:500;color:var(--faint);font-size:13px}
.grp.closed .items{display:none}
.item{display:grid;grid-template-columns:26px 1fr 14px;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px 9px 12px;border-radius:9px;cursor:pointer;align-items:start}
.item:hover{background:var(--accent-soft)}
.item.active{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.item .no{color:var(--faint);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.item .en{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .zh{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.st{width:11px;height:11px;border-radius:50%;margin-top:7px;border:2px solid var(--line2)}
.st.part{border-color:var(--part);background:linear-gradient(90deg,var(--part) 50%,transparent 50%)}
.st.full{border-color:var(--done);background:var(--done)}
.item.dragging,.grp.dragging{opacity:.4}
.item.drop-before{box-shadow:inset 0 3px 0 var(--hot)}
.item.drop-after{box-shadow:inset 0 -3px 0 var(--hot)}
.grp.drop-before>.grp-h{box-shadow:inset 0 3px 0 var(--hot)}
.grp.drop-after{box-shadow:inset 0 -3px 0 var(--hot)}
.grp.drop-into>.grp-h{background:var(--hot-soft)}
.item[draggable],.grp-h[draggable]{cursor:grab}
.sidetools{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 0;font-size:12.5px;color:var(--faint)}
.sidetools button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline}
.add{margin:14px 6px 0;width:calc(100% - 12px);justify-content:center;border-style:dashed;color:var(--accent)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:6px 12px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .st{margin:0}

/* ---------- main ---------- */
.main{overflow:auto;min-height:0}
.wrap{max-width:1120px;margin:0 auto;padding:24px 30px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow)}
.crumb{font-size:13.5px;color:var(--accent);font-weight:600}
.p-en{font-size:25px;font-weight:700;line-height:1.35;margin:6px 0 4px}
.p-zh{font-size:16.5px;color:var(--muted)}
.p-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:14px;font-size:14.5px;color:var(--muted)}
.p-meta a.doi{color:var(--accent);text-decoration:none}
.p-meta a.doi:hover{text-decoration:underline}
.p-meta .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.urlrow{margin-top:8px;font-size:13px;color:var(--faint);word-break:break-all}
.urlrow button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0 4px}
.abs{margin-top:16px;border-top:1px dashed var(--line2);padding-top:12px;font-size:15.5px;line-height:1.8}
.abs .toggle{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13.5px;padding:0 0 0 6px;text-decoration:underline}
.abs .en{color:var(--muted);font-size:15px}
.abs-h{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px;border-radius:6px;padding:1px 8px;margin-right:8px}

.notes-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.notes-h h2{font-size:18px;margin:0;color:var(--accent)}
.saved{font-size:13px;color:var(--faint)}
.notes{padding:6px 24px 14px}
.f{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{font-size:15.5px;font-weight:700;padding-top:7px}
.f label .col{display:inline-block;min-width:20px;color:var(--faint);font-weight:500;font-size:12.5px}
.f label small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.45;margin-top:3px;padding-left:20px}
.f textarea,.f input.txt{width:100%;border:1px solid var(--line2);background:var(--field);border-radius:9px;padding:8px 12px;line-height:1.7;resize:vertical;overflow:hidden;min-height:42px;font-size:16px}
.f textarea:focus,.f input.txt:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:3px;align-items:center}
.chip{border:1.5px solid var(--line2);background:var(--field);border-radius:999px;padding:5px 15px;cursor:pointer;font-size:15px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip-other{border:1.5px dashed var(--line2);background:transparent;border-radius:999px;padding:5px 14px;font-size:15px;width:150px}
.chip-other:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tipbox{grid-column:2;margin-top:-4px;background:var(--tip);border-left:4px solid var(--tip-line);border-radius:8px;padding:8px 14px;font-size:15px}
.tipbox b{margin-right:6px}
.f textarea.detail{grid-column:2;margin-top:2px;border-style:dashed;background:#fffdf6}
@media (max-width:900px){.f textarea.detail{grid-column:1}}
.nav{display:flex;justify-content:space-between;margin-top:18px}

/* ---------- stats ---------- */
.stats h1{font-size:22px;margin:0 0 4px;color:var(--accent)}
.stats .sub{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:14px;color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart h3{margin:0 0 2px;font-size:16.5px}
.chart .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.brow{display:grid;grid-template-columns:128px 1fr 34px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.brow:hover,.brow.on{background:var(--accent-soft)}
.brow .lab{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .track{height:18px;position:relative}
.brow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:0;transition:width .3s}
.brow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.brow.zero .num{color:var(--faint);font-weight:500}
.chart .empty{font-size:13px;color:var(--faint);margin-top:8px;padding-left:6px}
.drill{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.drill a{display:block;font-size:14px;color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:6px;cursor:pointer}
.drill a:hover{background:var(--accent-soft);color:var(--accent)}
.grp-prog .brow{cursor:default}
.grp-prog .brow:hover{background:transparent}
.grp-prog .brow{grid-template-columns:170px 1fr 60px}
.grp-prog .track{background:var(--line);border-radius:4px}
.grp-prog .fill{border-radius:4px}


/* ---------- charts ---------- */
.viz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--other:#9aa39c;--grid:#dfe8da;--axis:#a9b8a6}
.chart-card{padding:18px 20px}
.chart-card h3{margin:0;font-size:17px}
.chart-card .hint{font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.donut-wrap{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center}
.donut-wrap svg{width:160px;height:160px;display:block}
.donut-wrap path{cursor:pointer;transition:opacity .15s}
.donut-wrap path:hover{opacity:.85}
.donut-wrap path.dim{opacity:.35}
.lg{display:flex;flex-direction:column;gap:4px}
.lg-row{display:grid;grid-template-columns:12px 1fr auto 44px;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:14.5px;width:100%}
.lg-row:hover,.lg-row.on{background:var(--accent-soft)}
.lg-row i{width:12px;height:12px;border-radius:3px}
.lg-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-row b{font-variant-numeric:tabular-nums}
.lg-row em{font-style:normal;color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:210px;padding:0 4px;border-bottom:1.5px solid var(--axis);position:relative}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:transparent;padding:0}
.vcol .v{font-size:14px;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.vcol .b{width:min(46px,70%);max-height:calc(100% - 24px);background:var(--bar);border-radius:5px 5px 0 0;min-height:0;transition:height .3s}
.vcol:hover .b,.vcol.on .b{background:var(--accent)}
.vcol.on .v{color:var(--accent)}
.col-labels{display:flex;gap:10px;padding:6px 4px 0}
.col-labels span{flex:1;text-align:center;font-size:13px;line-height:1.35;color:var(--ink)}
.line-svg{width:100%;height:auto;display:block}
.line-svg text{font-size:12px;fill:var(--muted);font-family:inherit}
.line-svg .end{font-size:13px;font-weight:700}
.lg-inline{display:flex;gap:16px;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.lg-inline span{display:inline-flex;align-items:center;gap:6px}
.lg-inline i{width:16px;height:3px;border-radius:2px}
.stack-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 64px;gap:12px;align-items:center;padding:6px 0}
.stack-row .lab{font-size:14.5px}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;gap:2px;background:transparent}
.stack span{height:100%}
.stack-row .num{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty-chart{color:var(--faint);font-size:14px;padding:30px 0;text-align:center}
.drill{margin-top:12px;border-top:1px dashed var(--line2);padding-top:8px}
.drill .dt{font-size:13.5px;color:var(--muted);margin-bottom:4px}
#vtip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 10px;border-radius:7px;opacity:0;transition:opacity .1s;z-index:30;max-width:320px}


/* ---------- folder link / images ---------- */
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-top:6px;line-height:1.4}
.conn i{width:8px;height:8px;border-radius:50%;flex:none}
.conn.ok{color:var(--done)} .conn.ok i{background:var(--done)}
.conn.bad{color:#b3412e} .conn.bad i{background:#b3412e}
.saved.bad{color:#b3412e;font-weight:600}
.banner{margin:18px 30px 0;background:var(--tip);border:1px solid var(--tip-line);border-left:5px solid var(--tip-line);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.7}
.banner button{margin-left:10px;border:1px solid var(--tip-line);background:#fff;border-radius:7px;padding:2px 10px;cursor:pointer}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.imgs:not(:empty){margin-bottom:10px}
.imgcard{position:relative;margin:0;border:1px solid var(--line2);border-radius:10px;background:var(--field);overflow:hidden}
.imgcard img{display:block;width:100%;height:150px;object-fit:contain;background:#f3f6f1;cursor:zoom-in}
.imgcard .cap{width:100%;border:0;border-top:1px solid var(--line);padding:7px 10px;font-size:14px;background:transparent}
.imgcard .cap:focus{outline:2px solid var(--accent);outline-offset:-2px}
.imgcard .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(31,45,37,.65);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.imgcard .del:hover{background:#b3412e}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:14.5px}
.drop.over{border-color:var(--hot);background:var(--hot-soft)}
.drop button{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14.5px}
.lb{position:fixed;inset:0;background:rgba(15,25,20,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;padding:24px;cursor:zoom-out}
.lb.show{display:flex}
.lb img{max-width:96%;max-height:86vh;border-radius:6px;background:#fff}
.lb-cap{color:#fff;margin-top:10px;font-size:15px}
.lb-cap span{color:#b9c9bf;font-size:12.5px}


/* ---------- knowledge panel ---------- */
.kp{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.kp-head{display:flex;align-items:center;gap:8px;padding:16px 14px 10px}
.kp-title{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.kp-title span{font-size:13px;color:var(--faint);font-weight:500}
.kp-scope{margin-left:auto;display:flex;background:var(--line);border-radius:8px;padding:3px}
.kp-scope button{border:0;background:transparent;border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.kp-scope button.on{background:var(--panel);color:var(--accent);font-weight:600}
.kp-close{border:0;background:transparent;font-size:18px;color:var(--muted);cursor:pointer;padding:0 4px}
.kp-add{padding:0 14px 10px;border-bottom:1px solid var(--line)}
.kp-add textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:15px;line-height:1.6;resize:vertical;background:var(--field);min-height:70px}
.kp-add textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.kp-add-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.kp-for{font-size:12.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-list{overflow:auto;flex:1;padding:10px 14px 30px}
.kp-empty{color:var(--faint);font-size:14px;text-align:center;padding:26px 6px;line-height:1.8}
.kp-grp{font-size:13.5px;font-weight:700;color:var(--accent);margin:14px 0 6px;cursor:pointer}
.kp-grp:hover{text-decoration:underline}
.kp-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tip-line);border-radius:9px;padding:8px 10px 6px;margin-bottom:8px}
.kp-card textarea{width:100%;border:0;background:transparent;font-size:15px;line-height:1.65;resize:none;overflow:hidden;padding:0;min-height:26px}
.kp-card textarea:focus{outline:none}
.kp-card:focus-within{border-color:var(--accent)}
.kp-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-top:2px}
.kp-meta .sp{flex:1}
.kp-meta button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:12.5px;padding:1px 4px;border-radius:4px}
.kp-meta button:hover{color:var(--accent);background:var(--accent-soft)}
.kp-meta button.del:hover{color:#b3412e;background:#fbe6e1}
.kp-tab{position:fixed;right:0;top:40%;writing-mode:vertical-rl;border:0;background:var(--accent);color:#fff;padding:12px 6px;border-radius:9px 0 0 9px;cursor:pointer;font-size:14px;letter-spacing:2px;z-index:15;display:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.kp-tab b{display:block;margin-top:6px;font-weight:600;letter-spacing:0}
.app.kp-off ~ .kp-tab{display:block}
.app.stats-on ~ .kp-tab{display:none}
.selbtn{position:fixed;display:none;z-index:25;border:0;background:var(--hot);color:#fff;font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.stats-on #resizer2,.stats-on .kp{display:none}
.app.stats-on{grid-template-columns:var(--sidew,370px) 8px 1fr 0 0}
@media (max-width:900px){ .kp{max-height:60vh} #resizer2{display:none} }

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(30,45,35,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.dlg{background:var(--panel);border-radius:16px;padding:22px 24px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dlg h3{margin:0 0 14px;color:var(--accent)}
.dlg .row{margin-bottom:12px}
.dlg .row label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.dlg input,.dlg select{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;background:var(--field);font-size:15px}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:.97}
@media (max-width:900px){
  .app,.app.kp-off,.app.stats-on{grid-template-columns:1fr;height:auto}
  .resizer{display:none}
  .wrap{padding:16px}
  .f{grid-template-columns:1fr;gap:6px}
  .f label{padding-top:0}
  .tipbox{grid-column:1}
  .kpis{grid-template-columns:1fr 1fr}
  .charts{grid-template-columns:1fr}
  .notes{padding:6px 16px 12px}
}

.topic{font-size:13px;color:var(--muted);margin-top:2px}
.item .en .star{color:#d08a00;margin-right:4px;font-weight:700}
.tag{display:inline-block;font-size:11.5px;line-height:1;padding:3px 6px;border-radius:5px;margin-right:5px;vertical-align:1px;font-weight:600}
.tag.sel{background:var(--accent-soft);color:var(--accent)}
.tag.rev{background:#e3ebf7;color:#2c5a93}
.bigstar{color:#d08a00;font-size:15px;letter-spacing:1px;margin-left:6px;vertical-align:-1px}
.p-meta .rank{background:#fbefd5;color:#7a4d00;border-radius:6px;padding:2px 8px;font-weight:600}
.tag.big{font-size:12.5px;padding:4px 8px}
.ctx{position:fixed;z-index:9999;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;min-width:190px;display:none}
.ctx.show{display:block}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14.5px;color:inherit}
.ctx button:hover{background:var(--accent-soft)}
.ctx button.danger{color:#b3412e}
.ctx .ctx-t{font-size:12.5px;color:var(--faint);padding:6px 12px 4px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trash-btn{margin:10px 6px 0;width:calc(100% - 12px);justify-content:center;color:var(--muted)}
.trash-list{max-height:55vh;overflow:auto;margin:6px 0 4px}
.trash-row{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.trash-row .t{flex:1;min-width:0}
.trash-row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trash-row .t .z{font-size:13px;color:var(--muted)}
.trash-empty{color:var(--faint);padding:18px 4px}

.gh-dlg{width:520px}
.gh-dlg p{font-size:14.5px;color:var(--muted);margin:0 0 12px;line-height:1.7}
.gh-dlg input{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:15px}
.gh-err{color:#b3412e;font-size:14px;min-height:20px;margin-top:6px}
.gh-note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.6}
@media (max-width:900px){ .kp-tab{top:auto;bottom:80px} .p-meta{flex-wrap:wrap} .p-meta .right{margin-left:0} }
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:30;color:var(--muted);font-size:16px}

/* ---------- mobile table of contents (drawer) ---------- */
.toc-btn,.toc-bar,.toc-mask{display:none}
@media (hover:none){ .item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none} }
@media (max-width:900px){
  .main{padding-top:62px}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:9;width:min(86vw,380px);height:100%;max-height:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  body.toc-open .side{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:6px 0 28px rgba(0,0,0,.18)}
  .side .list{flex:none;overflow:visible}
  .toc-bar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3;background:var(--side);border-bottom:1px solid var(--line);padding:6px 8px 6px 20px}
  .toc-bar b{font-size:16px;color:var(--accent)}
  .toc-close{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
  .toc-close:hover{background:var(--accent-soft);color:var(--accent)}
  .toc-btn{display:inline-flex;align-items:center;gap:6px;position:fixed;top:10px;left:10px;z-index:7;min-height:44px;min-width:44px;padding:0 18px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
  body.toc-open .toc-mask{display:block;position:fixed;inset:0;z-index:8;background:rgba(20,35,28,.38)}
  body.toc-open{overflow:hidden}
  body.toc-open #kpTab{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="toc-bar"><b>目录</b><button class="toc-close" id="tocClose" type="button" aria-label="关闭目录" title="关闭目录">✕</button></div>
    <div class="side-head">
      <div class="brand">文献阅读工作台</div><div class="topic">遗产AI交互 · 2025–2026 新文献</div>
      <div class="conn" id="conn"></div>
      <div class="progress"><span id="progTxt"></span><span id="progPct"></span></div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="actions">
        <button class="btn primary" id="btnExport">导出 Excel</button>
        <button class="btn" id="btnImport" title="从之前导出的 Excel 恢复笔记">导入</button>
        <input type="file" id="fileImport" accept=".xlsx" hidden>
      </div>
      <div class="tabs">
        <button class="tab" data-view="lit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>1 文献</button>
        <button class="tab" data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>2 统计</button>
      </div>
    </div>
    <nav class="list" id="list"></nav>
  </aside>
  <div class="resizer" id="resizer" title="拖动调整左栏宽度（双击恢复）"></div>
  <main class="main" id="main">
    <div class="banner" id="banner" hidden></div>
    <div class="wrap" id="viewLit">
      <section class="card" id="paper"></section>
      <div class="notes-h"><h2>阅读笔记</h2><span class="saved" id="saved"></span></div>
      <section class="card notes" id="notes"></section>
      <div class="nav">
        <button class="btn" id="prev">← 上一篇</button>
        <button class="btn" id="next">下一篇 →</button>
      </div>
    </div>
    <div class="wrap stats" id="viewStats" hidden></div>
  </main>
  <div class="resizer" id="resizer2" title="拖动调整知识点栏宽度（双击恢复）"></div>
  <aside class="kp" id="kp">
    <div class="kp-head">
      <div class="kp-title">知识点 <span id="kpCount"></span></div>
      <div class="kp-scope"><button data-scope="one">本篇</button><button data-scope="all">全部</button></div>
      <button class="kp-close" id="kpClose" title="收起">»</button>
    </div>
    <div class="kp-add" id="kpAddBox">
      <textarea id="kpInput" rows="3" placeholder="把学到的知识点粘贴或写在这里&#10;Ctrl+Enter 快速添加"></textarea>
      <div class="kp-add-row"><span class="kp-for" id="kpFor"></span><button class="btn primary" id="kpAdd">添加</button></div>
    </div>
    <div class="kp-list" id="kpList"></div>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="dlg">
    <h3>添加一篇论文</h3>
    <div class="row"><label>英文原题 *</label><input id="aEn"></div>
    <div class="row"><label>中文题目</label><input id="aZh"></div>
    <div class="row"><label>年份 / 阵地</label><input id="aVenue" placeholder="例如：2026 / npj Heritage Science"></div>
    <div class="row"><label>原文链接或 DOI</label><input id="aUrl" placeholder="https://… 或 10.xxxx/…"></div>
    <div class="row"><label>中文摘要（可选）</label><textarea id="aAbs" rows="3" style="width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-size:15px;resize:vertical"></textarea></div>
    <div class="row"><label>放到哪个分类</label><select id="aGroup"></select></div>
    <div class="row" id="aNewRow" hidden><label>新分类名称</label><input id="aNew"></div>
    <div class="btns"><button class="btn" id="aCancel">取消</button><button class="btn primary" id="aOk">添加</button></div>
  </div>
</div>
<button class="toc-btn" id="tocBtn" type="button" aria-controls="list" aria-expanded="false">☰ 目录</button>
<div class="toc-mask" id="tocMask"></div>
<button class="kp-tab" id="kpTab" title="打开知识点小板">知识点<b id="kpTabN"></b></button>
<button class="selbtn" id="selBtn">＋ 加入知识点</button>
<div class="toast" id="toast"></div>
<div class="loading" id="loading">正在从 GitHub 私有仓库读取…</div>
<div class="modal" id="ghModal"><div class="dlg gh-dlg">
  <h3>开启云同步（可选）</h3>
  <p>不开也完全能用：笔记会存在这台设备的浏览器里。开启后，笔记会存到你的 GitHub 私有仓库，换设备打开自动同步。需要一把 GitHub 访问令牌（钥匙），只保存在这台设备上。</p>
  <div class="row"><label>GitHub 用户名</label><input id="ghOwner" autocomplete="username"></div>
  <div class="row"><label>数据仓库名</label><input id="ghRepo" value="lit-workbench-data"></div>
  <div class="row"><label>访问令牌（钥匙）</label><input id="ghToken" type="password" autocomplete="current-password" placeholder="github_pat_…"></div>
  <div class="gh-err" id="ghErr"></div>
  <div class="btns"><button class="btn" id="ghCancel">先不开</button><button class="btn primary" id="ghOk">连接</button></div>
  <div class="gh-note">在公用电脑上用完，记得点左下角「更换钥匙」退出。</div>
</div></div>
<div class="ctx" id="ctx"><div class="ctx-t" id="ctxT"></div><button id="ctxOpen">打开原文网页 ↗</button><button class="danger" id="ctxDel">删除（移入回收站）</button></div>
<div class="modal" id="trashModal"><div class="dlg"><h3>回收站</h3><div style="font-size:13.5px;color:var(--muted)">删掉的论文在这里，笔记和图片都还在。点「恢复」放回原来的分类，表格会同步更新。</div><div class="trash-list" id="trashList"></div><div class="btns"><button class="btn" id="trashClose">关闭</button></div></div></div>
<div id="vtip"></div>
<div class="lb" id="lb"></div>
